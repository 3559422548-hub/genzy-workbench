<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Genzy 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="" id="appIconLink">
<link rel="manifest" href="" id="manifestLink">
<style>
:root {
  --bg: #f4f4f0;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #111111;
  --muted: #555555;
  --border: #111111;
  --accent: #3b82f6;
  --accent-soft: #dbeafe;
  --danger: #ef4444;
  --success: #22c55e;
  --shadow: 0 5px 0 #111111;
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar-w: 230px;
  --touch: 46px;
  --pixel: 'Press Start 2P', cursive;
  --body: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  overflow-x: hidden;
  image-rendering: pixelated;
}
.pixel { font-family: var(--pixel); line-height: 1.4; }
button, input, select, textarea {
  font-family: inherit; font-size: 1rem; color: inherit;
}
/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--text); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* Layout */
#app { display:flex; min-height:100vh; }
#sidebar {
  position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w);
  background: var(--surface); border-right: 3px solid var(--border);
  display:flex; flex-direction:column; z-index:100;
  transform: translateX(0); transition: transform .25s ease;
}
#sidebar .brand {
  padding: 1.2rem; border-bottom: 3px solid var(--border);
  display:flex; align-items:center; gap:.75rem;
}
#sidebar .brand .logo {
  width: 42px; height: 42px; background: var(--text); color: var(--surface);
  display:grid; place-items:center; border-radius: 10px; font-family: var(--pixel); font-size: .7rem;
}
#sidebar .brand h1 { font-size: .95rem; margin:0; font-family: var(--pixel); }
#sidebar .brand small { font-size: .65rem; color: var(--muted); display:block; margin-top:.2rem; }
#nav { flex:1; overflow-y:auto; padding: .6rem; }
.nav-item {
  display:flex; align-items:center; gap:.7rem;
  padding: .85rem .7rem; margin-bottom: .35rem;
  border: 2px solid transparent; border-radius: var(--radius-sm);
  cursor: pointer; min-height: var(--touch);
  transition: .15s;
}
.nav-item:hover { background: var(--surface-2); border-color: var(--border); }
.nav-item.active { background: var(--text); color: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
.nav-item .icon { font-size: 1.25rem; width: 26px; text-align:center; }
.nav-item .label { font-size: .9rem; font-weight: 700; }
#sidebar .foot { padding: .8rem; border-top: 3px solid var(--border); font-size: .7rem; color: var(--muted); text-align:center; }

#main {
  flex:1; margin-left: var(--sidebar-w); min-height:100vh;
  padding: 1.2rem; padding-bottom: 5rem;
}
#topbar {
  display:none; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:90; background: var(--bg);
  padding: .6rem 0; margin: -1.2rem -1.2rem 1rem -1.2rem;
  padding-left: 1.2rem; padding-right: 1.2rem; border-bottom: 2px solid transparent;
}
#menuBtn {
  width: var(--touch); height: var(--touch); border: 2px solid var(--border);
  background: var(--surface); border-radius: 10px; display:grid; place-items:center;
  box-shadow: 3px 3px 0 var(--border); cursor:pointer;
}
#menuBtn:active { transform: translate(3px,3px); box-shadow: none; }
#overlay {
  display:none; position:fixed; inset:0; background: rgba(0,0,0,.35); z-index:99;
}

@media (max-width: 768px) {
  #sidebar { transform: translateX(-110%); width: min(80vw, 280px); border-right:none; box-shadow: 6px 0 0 rgba(0,0,0,.2); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left:0; padding: .9rem; padding-bottom: 5rem; }
  #topbar { display:flex; border-bottom-color: var(--border); }
  #overlay.show { display:block; }
  .page-title { font-size: 1.05rem; }
}

/* Cards & components */
.card {
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 1rem; margin-bottom: 1rem;
}
.card-title {
  font-family: var(--pixel); font-size: .78rem; margin: 0 0 .8rem 0;
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
}
.card-subtitle { font-size: .8rem; color: var(--muted); margin: -.4rem 0 .7rem 0; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
  min-height: var(--touch); min-width: var(--touch);
  padding: .5rem .85rem; border: 2px solid var(--border); border-radius: var(--radius-sm);
  background: var(--text); color: var(--surface); font-weight: 700; cursor: pointer;
  box-shadow: 3px 3px 0 var(--border); font-size: .9rem;
}
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn:active:not(:disabled) { transform: translate(3px,3px); box-shadow: none; }
.btn.secondary { background: var(--surface); color: var(--text); }
.btn.accent { background: var(--accent); }
.btn.danger { background: var(--danger); }
.btn.success { background: var(--success); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: none; border-color: transparent; }
.btn-sm { min-height: 34px; padding: .35rem .6rem; font-size: .8rem; box-shadow: 2px 2px 0 var(--border); }
.btn-sm:active { transform: translate(2px,2px); box-shadow:none; }
.input, .select, .textarea {
  width:100%; min-height: var(--touch); border: 2px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); padding: .55rem .7rem; outline:none;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-row { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom: .7rem; align-items:flex-end; }
.form-row .input, .form-row .select { flex:1; min-width: 120px; }
label { display:block; font-size: .75rem; font-weight: 700; margin-bottom: .25rem; color: var(--muted); }

/* Lists */
.list-item {
  display:flex; align-items:center; gap:.7rem; padding: .7rem;
  background: var(--surface-2); border: 2px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: .5rem;
}
.list-item.done { opacity:.65; }
.list-item.done .item-text { text-decoration: line-through; }
.checkbox {
  width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 6px;
  display:grid; place-items:center; cursor:pointer; flex-shrink:0; background: var(--surface);
}
.checkbox.checked { background: var(--success); color: var(--surface); }
.item-text { flex:1; word-break:break-word; }
.item-actions { display:flex; gap:.3rem; }

/* Empty state */
.empty { text-align:center; color: var(--muted); padding: 1.5rem .5rem; font-size: .85rem; }

/* Progress */
.progress-bar {
  height: 18px; background: var(--surface-2); border: 2px solid var(--border); border-radius: 10px; overflow:hidden;
}
.progress-fill { height:100%; background: var(--success); width:0%; transition: width .3s; }

/* Tags/pills */
.pill {
  display:inline-flex; align-items:center; padding: .25rem .55rem; border: 2px solid var(--border);
  border-radius: 99px; font-size: .72rem; font-weight: 700; background: var(--surface);
}

/* Flip clock */
.flip-clock {
  display:flex; gap:.5rem; justify-content:center; align-items:center; flex-wrap:wrap;
  background: #111; border: 3px solid var(--border); border-radius: var(--radius); padding: 1rem;
  color: #eee; margin: .5rem 0;
}
.flip-group { display:flex; gap:.25rem; }
.flip-digit {
  width: 56px; height: 78px; background: #222; border-radius: 10px;
  display:grid; place-items:center; font-family: var(--pixel); font-size: 2rem;
  position:relative; overflow:hidden; box-shadow: inset 0 2px 0 rgba(255,255,255,.1);
}
.flip-digit::after {
  content:''; position:absolute; left:0; right:0; top:50%; height: 2px; background: #000;
}
.flip-sep { font-family: var(--pixel); font-size: 1.4rem; align-self:center; }
.flip-label { width:100%; text-align:center; font-size: .6rem; margin-top:.35rem; color:#aaa; font-family: var(--pixel); }
@media (min-width: 769px) {
  .flip-digit { width: 84px; height: 110px; font-size: 3rem; }
  .flip-sep { font-size: 2rem; }
}

/* Forest */
.forest-grid {
  display:grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap:.35rem;
  max-height: 200px; overflow-y:auto; padding: .5rem; background: var(--surface-2); border-radius: var(--radius-sm);
  border: 2px dashed var(--border);
}
.tree { font-size: 1.4rem; text-align:center; }

/* Grid */
.grid-2 { display:grid; grid-template-columns: repeat(2, 1fr); gap:.7rem; }
.grid-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:.7rem; }
@media (max-width: 480px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* Link cards */
.link-card {
  background: var(--surface-2); border: 2px solid var(--border); border-radius: var(--radius-sm);
  padding: .8rem; display:flex; flex-direction:column; gap:.35rem;
}
.link-card a { color: var(--accent); text-decoration: none; font-weight: 700; word-break:break-all; }
.link-card small { color: var(--muted); font-size: .75rem; }

/* Audio player custom */
.audio-box { width:100%; border-radius: var(--radius-sm); margin: .5rem 0; }

/* Canvas */
canvas { max-width:100%; border-radius: var(--radius-sm); background: #111; }

/* Toast */
#toast {
  position:fixed; bottom: 1.2rem; left:50%; transform: translateX(-50%) translateY(120px);
  background: var(--text); color: var(--surface); padding: .8rem 1.2rem; border-radius: var(--radius-sm);
  border: 2px solid var(--border); box-shadow: var(--shadow); z-index: 200; font-size: .85rem;
  opacity:0; transition: .3s;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity:1; }

/* Modal */
#modalOverlay {
  display:none; position:fixed; inset:0; background: rgba(0,0,0,.45); z-index:150; align-items:center; justify-content:center; padding: 1rem;
}
#modalOverlay.show { display:flex; }
#modalBox { background: var(--surface); border: 3px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); max-width: 520px; width:100%; max-height: 90vh; overflow-y:auto; padding: 1rem; }
#modalTitle { font-family: var(--pixel); font-size: .8rem; margin-bottom: .7rem; }

/* Module visibility */
.module { display:none; animation: fade .2s; }
.module.active { display:block; }
@keyframes fade { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }

/* Mobile-only / desktop-only */
@media (min-width: 769px) { .mobile-only { display:none !important; } }
@media (max-width: 768px) { .desktop-only { display:none !important; } }

/* Book item */
.book-item { display:flex; gap:.8rem; align-items:flex-start; }
.book-item img { width: 64px; height: 90px; object-fit:cover; border:2px solid var(--border); border-radius: 6px; background:#ddd; }

/* Stat grid */
.stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:.6rem; }
.stat-box { background: var(--surface-2); border:2px solid var(--border); border-radius: var(--radius-sm); padding: .6rem; text-align:center; }
.stat-box .num { font-family: var(--pixel); font-size: 1.1rem; }
.stat-box .lbl { font-size: .7rem; color: var(--muted); margin-top:.2rem; }

/* Collapsible */
.collap-head { cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
.collap-body { overflow:hidden; transition: max-height .25s; }

/* Plan tree */
.plan-node { margin-left: .6rem; border-left: 2px dashed var(--border); padding-left: .6rem; }
.plan-node .node-title { font-weight: 700; margin: .4rem 0; }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">GZ</div>
      <div>
        <h1>Genzy</h1>
        <small>工作台</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">数据仅存本地 · 刷新不丢</div>
  </aside>
  <main id="main">
    <div id="topbar">
      <div class="pixel page-title">Genzy</div>
      <button id="menuBtn" aria-label="菜单">☰</button>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>
<div id="modalOverlay"><div id="modalBox"><div id="modalTitle"></div><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const ICON_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="%23111"/><rect x="64" y="64" width="384" height="384" fill="%23fff" rx="40"/><rect x="120" y="120" width="80" height="80" fill="%23111"/><rect x="312" y="120" width="80" height="80" fill="%23111"/><rect x="120" y="216" width="272" height="40" fill="%23111"/><rect x="120" y="288" width="200" height="40" fill="%23111"/><rect x="120" y="360" width="272" height="40" fill="%23111"/></svg>`;

// ===== PWA =====
(function(){
  const manifest = {
    name: 'Genzy 工作台', short_name: 'Genzy',
    start_url: '.', display: 'standalone',
    background_color: '#f4f4f0', theme_color: '#111111',
    icons: [{ src: ICON_SVG, sizes: '512x512', type: 'image/svg+xml' }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
  document.getElementById('appIconLink').href = ICON_SVG;
  const swCode = `self.addEventListener('install', e=>{ self.skipWaiting(); e.waitUntil(caches.open('genzy-v1').then(c=>c.add(self.registration.scope))); }); self.addEventListener('activate', e=>e.waitUntil(clients.claim())); self.addEventListener('fetch', e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(self.registration.scope)))); });`;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
})();

// ===== Storage =====
const STORE_PREFIX = 'genzy_';
const Storage = {
  get(key, def){
    try { const v = localStorage.getItem(STORE_PREFIX+key); return v===null ? def : JSON.parse(v); }
    catch(e){ return def; }
  },
  set(key, val){ try { localStorage.setItem(STORE_PREFIX+key, JSON.stringify(val)); } catch(e){ toast('存储空间不足，请导出备份'); } },
  remove(key){ try { localStorage.removeItem(STORE_PREFIX+key); } catch(e){} },
  exportAll(){
    const out = {};
    for (let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); if (k && k.startsWith(STORE_PREFIX)) out[k]=localStorage.getItem(k);
    }
    return 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(out,null,2));
  },
  importAll(text){
    try {
      const data = JSON.parse(text);
      for (const k in data) { if (k.startsWith(STORE_PREFIX)) localStorage.setItem(k, data[k]); }
      return true;
    } catch(e){ return false; }
  }
};

// ===== State =====
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);
const fmtDate = (d) => new Date(d).toLocaleDateString('zh-CN', {month:'short', day:'numeric', weekday:'short'});

let state = {};
function loadState(){
  state = {
    settings: Storage.get('settings', {lastModule:'daily'}),
    forest: Storage.get('forest', {total:0, trees:[]}),
    daily: Storage.get('daily', {tasks:{}, currentDate: todayStr()}),
    english: Storage.get('english', {lessons:[], currentLessonId:null, currentStep:0, currentSentence:0, difficult:[], tasks:[]}),
    fitness: Storage.get('fitness', {groups:['默认'], links:[], tasks:[]}),
    collections: Storage.get('collections', {groups:['默认'], links:[]}),
    bills: Storage.get('bills', {expenses:{}, savings:0, savingsHistory:[]}),
    homework: Storage.get('homework', {images:[], tasks:[]}),
    music: Storage.get('music', {planProgress:{}, qaHistory:[], analyses:[]}),
    books: Storage.get('books', {tasks:[], timer:{}}),
    timers: Storage.get('timers', {events:[], stopwatch:{running:false,startTime:null,elapsed:0}, countdown:{target:null,running:false}})
  };
  if (!state.daily.tasks) state.daily.tasks = {};
  if (!state.daily.currentDate) state.daily.currentDate = todayStr();
}
let saveTimer;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    Storage.set('settings', state.settings);
    Storage.set('forest', state.forest);
    Storage.set('daily', state.daily);
    Storage.set('english', state.english);
    Storage.set('fitness', state.fitness);
    Storage.set('collections', state.collections);
    Storage.set('bills', state.bills);
    Storage.set('homework', state.homework);
    Storage.set('music', state.music);
    Storage.set('books', state.books);
    Storage.set('timers', state.timers);
  }, 200);
}

// ===== UI helpers =====
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
function modal(title, html){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html; $('#modalOverlay').classList.add('show'); }
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
$('#modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

const MODULES = [
  {id:'daily', label:'每日计划', icon:'🌲'},
  {id:'english', label:'外语学习', icon:'🔁'},
  {id:'fitness', label:'健身训练', icon:'💪'},
  {id:'collections', label:'内容收藏', icon:'⭐'},
  {id:'bills', label:'消费记账', icon:'💰'},
  {id:'homework', label:'作业完成', icon:'📝'},
  {id:'music', label:'编曲学习', icon:'🎹'},
  {id:'books', label:'书香书屋', icon:'📚'},
  {id:'timers', label:'计时记日', icon:'⏱️'}
];

function initNav(){
  const nav = $('#nav');
  nav.innerHTML = MODULES.map(m=>`<div class="nav-item" data-mod="${m.id}"><span class="icon">${m.icon}</span><span class="label">${m.label}</span></div>`).join('');
  $$('.nav-item', nav).forEach(el=> el.addEventListener('click', ()=> switchModule(el.dataset.mod)));
  $('#menuBtn').addEventListener('click', openSidebar);
  $('#overlay').addEventListener('click', closeSidebar);
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }

let currentModule = 'daily';
function switchModule(id){
  currentModule = id; state.settings.lastModule = id; saveState();
  $$('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.mod===id));
  renderContent();
  closeSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderContent(){
  $('#content').innerHTML = renderers[currentModule] ? renderers[currentModule]() : `<div class="card">模块建设中</div>`;
  if (initModule[currentModule]) initModule[currentModule]();
}

// ===== Daily tasks helpers =====
function getDailyTasks(date){
  if (!state.daily.tasks[date]) state.daily.tasks[date] = [];
  return state.daily.tasks[date];
}
function addDailyTask(date, text, source='daily', time=''){
  const list = getDailyTasks(date);
  const t = {id:uid(), text, done:false, source, time, created: Date.now()};
  list.push(t); saveState(); return t;
}
function removeDailyTask(date, id){
  const list = getDailyTasks(date);
  const t = list.find(x=>x.id===id);
  if (t && t.done) removeTree();
  state.daily.tasks[date] = list.filter(x=>x.id!==id);
  saveState();
}
function toggleDailyTask(date, id){
  const t = getDailyTasks(date).find(x=>x.id===id);
  if (!t) return;
  const wasDone = t.done;
  t.done = !t.done;
  if (t.done && !wasDone) plantTree();      // 完成 → 种树
  else if (!t.done && wasDone) removeTree(); // 取消完成 → 撤回种植
  saveState();
}
function plantTree(){
  state.forest.total++;
  state.forest.trees.push({id:uid(), date:todayStr()});
  saveState();
}
function removeTree(){
  if (state.forest.total > 0) state.forest.total--;
  if (state.forest.trees.length) state.forest.trees.pop();
  saveState();
}

// ===== Renderers registry =====
const renderers = {};
const initModule = {};

// ===== Daily Plan module =====
renderers.daily = function(){
  const date = state.daily.currentDate;
  const tasks = getDailyTasks(date);
  const done = tasks.filter(t=>t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const forestOpen = state.daily.forestOpen!==false;
  const todayTrees = state.forest.trees.filter(tr=>tr.date===todayStr()).length;
  return `
  <div class="card">
    <div class="card-title"><span>🌲 每日计划</span><span class="pill">${fmtDate(date)}</span></div>
    <div class="form-row">
      <div><label>选择日期</label><input type="date" class="input" id="dpDate" value="${date}"></div>
      <button class="btn" id="dpToday">今天</button>
    </div>
  </div>
  <div class="card">

function setFlipClock(idSuffix, totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60), s = totalSeconds%60;
  const set = (prefix, val)=>{
    const els = $$(`#${prefix}${idSuffix} .flip-digit`);
    if (els.length) { els[0].textContent = String(Math.floor(val/10)); els[1].textContent = String(val%10); }
  };
  set('fgH', h); set('fgM', m); set('fgS', s);
}
const TIMER_INTERVALS = {};
function startTick(key, updater){
  stopTick(key);
  updater();
  TIMER_INTERVALS[key] = setInterval(updater, 250);
}
function stopTick(key){
  if (TIMER_INTERVALS[key]) { clearInterval(TIMER_INTERVALS[key]); delete TIMER_INTERVALS[key]; }
}

const EN_STEPS = ['盲听','精听','跟读','复述'];
function parseSubtitles(text){
  const lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const srt = [];
  // Try SRT
  const srtRe = /(\d+)\s*\n(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/;
  for (let i=0;i<lines.length;i++){
    const m = lines[i].match(srtRe);
    if (m && lines[i+1]) { srt.push({start: parseTime(m[2]), end: parseTime(m[3]), text: lines[i+1]}); i++; }
  }
  if (srt.length) return srt;
  // Try LRC
  const lrcRe = /^\[(\d{2}):(\d{2}\.\d+)\](.*)$/;
  const lrc = [];
  lines.forEach(l=>{ const m=l.match(lrcRe); if(m) lrc.push({time: parseInt(m[1])*60+parseFloat(m[2]), text:m[3]}); });
  lrc.sort((a,b)=>a.time-b.time);
  if (lrc.length) return lrc.map((x,i)=>({start:x.time, end: lrc[i+1]?lrc[i+1].time:x.time+4, text:x.text}));
  // Plain text split sentences
  const raw = text.replace(/([。！？.!?])\s+/g,"$1\n").split('\n').map(s=>s.trim()).filter(Boolean);
  return raw.map((s,i)=>({start:null, end:null, text:s}));
}
function parseTime(t){ const p=t.replace(',','.').split(':'); return parseInt(p[0])*3600+parseInt(p[1])*60+parseFloat(p[2]); }

  });

  $$('.enDelLesson').forEach(b=> b.addEventListener('click', ()=>{

  const sentences = lesson.sentences||[];
  const playRange = (start,end)=>{
    if (start==null) { audio.play(); return; }
    audio.currentTime = start;
    audio.play();
    const stop = ()=>{ if (end!=null && audio.currentTime>=end) { audio.pause(); audio.removeEventListener('timeupdate', stop); } };
    audio.addEventListener('timeupdate', stop);
  };
  $('#enCloseLesson').addEventListener('click', ()=>{ state.english.currentLessonId=null; saveState(); renderContent(); });
  $('#enPrevStep').addEventListener('click', ()=>{ if(state.english.currentStep>0){state.english.currentStep--; saveState(); renderContent();} });

  $('#enPlayAll').addEventListener('click', ()=>{
    if (state.english.currentStep===0) { audio.currentTime=0; audio.play(); }
    else { const s=sentences[state.english.currentSentence]; if(s) playRange(s.start, s.end); }

  if ($('#enNextSent')) $('#enNextSent').addEventListener('click', ()=>{ if(state.english.currentSentence<sentences.length-1){state.english.currentSentence++; saveState(); renderContent();} });

  });
  if ($('#enRecord')) initSpeechRecognition();

    saveState(); $('#enRetell').value=''; toast('复述已保存');
  });
};
function initSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $('#enRecResult').textContent = '浏览器不支持语音识别'; return; }
  const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  $('#enRecord').addEventListener('click', ()=>{
    $('#enRecResult').textContent = '聆听中...';
    try { rec.start(); } catch(e){ toast('录音启动失败'); }
  });
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    $('#enRecResult').textContent = '识别结果：' + t;
    // Simple similarity score
    const lesson = state.english.lessons.find(l=>l.id===state.english.currentLessonId);
    const s = lesson.sentences[state.english.currentSentence];
    if (s) {
      const target = s.text.toLowerCase().split(/\s+/); const said = t.toLowerCase().split(/\s+/);
      const hit = said.filter(w=>target.includes(w)).length;
      const score = target.length ? Math.round(hit/target.length*100) : 0;
      $('#enRecResult').innerHTML += `<div style="margin-top:.4rem;color:var(--accent)">命中率 ${score}% · ${score>=70?'Great!':'再试一次'}</div>`;
    }
  };
  rec.onerror = ()=>{ $('#enRecResult').textContent = '识别失败，请重试'; };
}

function renderTimerUI(idSuffix){
  return `<div>${flipClockHTML(idSuffix)}</div>
  <div class="form-row" style="justify-content:center;flex-wrap:wrap">
    <input type="number" class="input" id="tMin${idSuffix}" placeholder="分" style="width:80px">
    <input type="number" class="input" id="tSec${idSuffix}" placeholder="秒" style="width:80px">
    <button class="btn" id="tStartC${idSuffix}">倒计时</button>
    <button class="btn secondary" id="tStartS${idSuffix}">正计时</button>
    <button class="btn danger" id="tStop${idSuffix}">停止</button>
    <button class="btn btn-sm secondary" id="tReset${idSuffix}">重置</button>
  </div>`;
}
function initTimer(idSuffix, onDone){
  let mode=''; // countup or countdown
  let remaining=0, elapsed=0, last=0;
  const update = ()=>{
    const now = Date.now();
    const delta = (now - last)/1000; last = now;
    if (mode==='countdown') { remaining -= delta; if (remaining<=0){ remaining=0; stopTick('timer'+idSuffix); if(onDone) onDone(); toast('计时结束'); } setFlipClock(idSuffix, remaining); }
    else if (mode==='countup') { elapsed += delta; setFlipClock(idSuffix, elapsed); }
  };
  const startCountdown = ()=>{
    const m=parseInt($('#tMin'+idSuffix).value||0), s=parseInt($('#tSec'+idSuffix).value||0);
    remaining = m*60+s; if(remaining<=0) return; mode='countdown'; last=Date.now(); startTick('timer'+idSuffix, update);
  };
  const startCountup = ()=>{ elapsed=0; mode='countup'; last=Date.now(); startTick('timer'+idSuffix, update); };
  $('#tStartC'+idSuffix).addEventListener('click', startCountdown);
  $('#tStartS'+idSuffix).addEventListener('click', startCountup);
  $('#tStop'+idSuffix).addEventListener('click', ()=> stopTick('timer'+idSuffix));
  $('#tReset'+idSuffix).addEventListener('click', ()=>{ stopTick('timer'+idSuffix); setFlipClock(idSuffix, 0); mode=''; });
  setFlipClock(idSuffix, 0);
}

function makeThumb(file, max=600){
  return new Promise((res)=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas');
      const scale = Math.min(max/img.width, max/img.height, 1);
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      res(canvas.toDataURL('image/jpeg',.7));
    };
    img.src=URL.createObjectURL(file);
  });
}

function drawSpectrum(canvas, analyser){
  if (!canvas || !canvas.isConnected) return;
  const ctx=canvas.getContext('2d');
  const data=new Uint8Array(analyser.frequencyBinCount);
  let af;
  function frame(){
    if (!canvas.isConnected) { cancelAnimationFrame(af); return; }
    analyser.getByteFrequencyData(data);
    ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const bars=60, barW=canvas.width/bars;
    for(let i=0;i<bars;i++){
      const v=data[Math.floor(i*data.length/bars)]/255;
      const h=v*canvas.height;
      ctx.fillStyle = `hsl(${200+v*80}, 80%, ${30+v*40}%)`;
      ctx.fillRect(i*barW+1, canvas.height-h, barW-2, h);
    }
    af = requestAnimationFrame(frame);
  }
  frame();
}
function generateMusicAnalysis(analyser, filename){
  const data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const bands = {bass:0, lowMid:0, mid:0, high:0};
  const sr = analyser.context.sampleRate;
  const bin = sr/2/data.length;
  let total=0;
  data.forEach((v,i)=>{
    const f=i*bin; total+=v;
    if(f<80) bands.bass+=v;
    else if(f<250) bands.lowMid+=v;
    else if(f<2000) bands.mid+=v;
    else bands.high+=v;
  });
  const max = Math.max(bands.bass, bands.lowMid, bands.mid, bands.high, 1);
  const likely = [];
  if (bands.bass/max > .35) likely.push('Kick / Bass');
  if (bands.lowMid/max > .3) likely.push('Bass Guitar / Synth Bass');
  if (bands.mid/max > .35) likely.push('Vocals / Guitars / Synths');
  if (bands.high/max > .3) likely.push('Hi-hats / Cymbals / Shakers');
  const energy = total/data.length;
  const bpmGuess = Math.max(60, Math.round(60 + energy/2));
  $('#musicAnalysisResult').innerHTML = `
    <div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:.5rem">
      <div style="font-weight:700;margin-bottom:.4rem">${escapeHtml(filename)} 分析结果</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">~${bpmGuess}</div><div class="lbl">估算 BPM</div></div>
        <div class="stat-box"><div class="num">${energy>80?'高':energy>40?'中':'低'}</div><div class="lbl">整体能量</div></div>
      </div>
      <div style="margin:.5rem 0"><b>频段能量比</b></div>
      <div class="progress-bar" style="margin-bottom:.3rem"><div class="progress-fill" style="width:${bands.bass/max*100}%;background:#ef4444"></div></div><small>低频 (Kick/Bass)</small>
      <div class="progress-bar" style="margin-bottom:.3rem"><div class="progress-fill" style="width:${bands.lowMid/max*100}%;background:#f59e0b"></div></div><small>中低频</small>
      <div class="progress-bar" style="margin-bottom:.3rem"><div class="progress-fill" style="width:${bands.mid/max*100}%;background:#22c55e"></div></div><small>中频 (乐器/人声)</small>
      <div class="progress-bar" style="margin-bottom:.3rem"><div class="progress-fill" style="width:${bands.high/max*100}%;background:#3b82f6"></div></div><small>高频</small>
      <div style="margin-top:.5rem"><b>可能乐器：</b>${likely.join('、') || '无法确定'}</div>
      <div class="card-subtitle">以上为前端估算，仅供参考，可结合耳朵进一步修正。</div>
    </div>`;
}

// ===== Books =====
const FALLBACK_BOOKS = [
  {id:1342, title:'傲慢与偏见', author:'Jane Austen'},
  {id:11, title:'爱丽丝梦游仙境', author:'Lewis Carroll'},
  {id:1661, title:'福尔摩斯探案集', author:'Arthur Conan Doyle'},
  {id:2701, title:'白鲸记', author:'Herman Melville'},
  {id:84, title:'弗兰肯斯坦', author:'Mary Shelley'},
  {id:145, title:' Middlemarch', author:'George Eliot'}
];
renderers.books = function(){
  const isMobile = /Mobi|Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth<768;
  if (!isMobile) return `<div class="card"><div class="card-title">📚 书香书屋</div><div class="empty">此模块仅在手机浏览器展示，请用手机访问。</div></div>`;
  return `<div class="card">
    <div class="card-title">📚 书香书屋</div>
    <a href="ibooks://" class="btn" style="margin-bottom:.6rem;width:100%">打开 iPhone 图书 App</a>
    <div class="card-subtitle">每日推荐 · 点击书名下载 epub</div>
    <div id="bookList"><div class="empty">正在加载推荐...</div></div>
  </div>
  <div class="card">
    <div class="card-title">阅读任务</div>
    <div class="form-row">
      <input type="date" class="input" id="bookDate" value="${todayStr()}">
      <input type="time" class="input" id="bookTime">
      <input class="input" id="bookTask" placeholder="阅读页数/章节">
      <button class="btn" id="bookAddTask">加入计划</button>
    </div>
    <div>${renderTaskTable(state.books.tasks, 'book')}</div>
  </div>
  <div class="card">
    <div class="card-title">阅读计时器</div>
    ${renderTimerUI('book')}
  </div>`;
};
initModule.books = async function(){
  const isMobile = /Mobi|Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth<768;
  if (!isMobile) return;
  let books = [];
  try {
    const res = await fetch('https://gutendex.com/books/?languages=en,zh');
    const data = await res.json();
    books = data.results.slice(0,5).map(b=>({id:b.id, title:b.title, author:(b.authors[0]&&b.authors[0].name)||'未知'}));
  } catch(e){ books = FALLBACK_BOOKS.slice(0,5); }
  $('#bookList').innerHTML = books.map(b=>`
    <div class="book-item">
      <img src="https://www.gutenberg.org/cache/epub/${b.id}/pg${b.id}.cover.medium.jpg" alt="cover" onerror="this.style.display='none'">
      <div>
        <div style="font-weight:700">${escapeHtml(b.title)}</div>
        <div style="font-size:.8rem;color:var(--muted)">${escapeHtml(b.author)}</div>
        <a class="btn btn-sm" style="margin-top:.3rem" href="https://www.gutenberg.org/ebooks/${b.id}.epub.images" target="_blank" rel="noopener">下载 epub</a>
      </div>
    </div>
  `).join('');
  $('#bookAddTask').addEventListener('click', ()=>{
    const date=$('#bookDate').value, time=$('#bookTime').value, text=$('#bookTask').value.trim();
    if(!text) return; state.books.tasks.push({id:uid(), date, time, text}); addDailyTask(date, text, 'books', time); saveState(); renderContent(); toast('阅读计划已添加');
  });
  $$('.bookDelTask').forEach(b=> b.addEventListener('click', ()=>{
    const t=state.books.tasks.find(x=>x.id===b.dataset.id); if(t) removeDailyTask(t.date, b.dataset.id);
    state.books.tasks=state.books.tasks.filter(x=>x.id!==b.dataset.id); saveState(); renderContent();
  }));
  initTimer('book');
};

// ===== Timers / Day Matter =====
renderers.timers = function(){
  return `<div class="card">
    <div class="card-title">⏱️ 计时记日</div>
    ${flipClockHTML('main')}
    <div class="form-row" style="justify-content:center">
      <button class="btn" id="tmStartC">倒计时</button>
      <button class="btn secondary" id="tmStartS">正计时</button>
      <button class="btn danger" id="tmStop">停止</button>
      <button class="btn btn-sm secondary" id="tmReset">重置</button>
    </div>
    <div class="form-row" style="justify-content:center">
      <input type="number" class="input" id="tmMin" placeholder="分" style="width:90px">
      <input type="number" class="input" id="tmSec" placeholder="秒" style="width:90px">
    </div>
  </div>
  <div class="card">
    <div class="card-title">纪念日 / 倒数日</div>
    <div class="form-row">
      <input class="input" id="tmEventTitle" placeholder="事件名称">
      <input type="date" class="input" id="tmEventDate" value="${todayStr()}">
      <select class="select" id="tmEventType"><option value="countdown">倒计时</option><option value="countup">正计时</option></select>
      <button class="btn" id="tmAddEvent">添加</button>
    </div>
    <div id="tmEvents">${renderTimerEvents()}</div>
  </div>`;
};
function renderTimerEvents(){
  if (!state.timers.events.length) return '<div class="empty">添加纪念日或特殊日期</div>';
  const now = new Date(); const today = new Date(now.toDateString());
  return state.timers.events.map(e=>{
    const d = new Date(e.date); const diff = Math.round((d - today)/(1000*60*60*24));
    const label = e.type==='countdown' ? (diff>=0?`还有 ${diff} 天`:`已过去 ${Math.abs(diff)} 天`) : (diff<=0?`已过 ${Math.abs(diff)} 天`:`还有 ${diff} 天`);
    return `<div class="list-item"><div class="item-text"><b>${escapeHtml(e.title)}</b><div style="font-size:.75rem;color:var(--muted)">${e.date}</div></div><div class="pill">${label}</div><button class="btn btn-sm danger tmDelEvent" data-id="${e.id}">删</button></div>`;
  }).join('');
}
initModule.timers = function(){
  let mode=''; let remaining=0, elapsed=0, last=0;
  const update=()=>{
    const now=Date.now(); const d=(now-last)/1000; last=now;
    if(mode==='countdown'){ remaining-=d; if(remaining<=0){remaining=0; stopTick('timerMain'); toast('倒计时结束');} setFlipClock('main', remaining); }
    else if(mode==='countup'){ elapsed+=d; setFlipClock('main', elapsed); }
  };
  $('#tmStartC').addEventListener('click', ()=>{
    const m=parseInt($('#tmMin').value||0), s=parseInt($('#tmSec').value||0); remaining=m*60+s; if(remaining<=0) return; mode='countdown'; last=Date.now(); startTick('timerMain', update);
  });
  $('#tmStartS').addEventListener('click', ()=>{ elapsed=0; mode='countup'; last=Date.now(); startTick('timerMain', update); });
  $('#tmStop').addEventListener('click', ()=> stopTick('timerMain'));
  $('#tmReset').addEventListener('click', ()=>{ stopTick('timerMain'); setFlipClock('main', 0); mode=''; });
  $('#tmAddEvent').addEventListener('click', ()=>{
    const title=$('#tmEventTitle').value.trim(), date=$('#tmEventDate').value, type=$('#tmEventType').value;
    if(!title||!date) return; state.timers.events.push({id:uid(), title, date, type}); saveState(); renderContent(); toast('纪念日已添加');
  });
  $$('.tmDelEvent').forEach(b=> b.addEventListener('click', ()=>{ state.timers.events=state.timers.events.filter(e=>e.id!==b.dataset.id); saveState(); renderContent(); }));
  setFlipClock('main', 0);
};

// ===== Boot =====
loadState();
initNav();
switchModule(state.settings.lastModule || 'daily');
window.addEventListener('beforeunload', ()=> saveState());

</script>
</body>
