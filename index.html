var ADV_COLS = 7;
// 地形种子：根据 (row, col) 确定地形，确保每次渲染一致
var ADV_TERRAIN = ['grass','tree','water','mountain','lava','peak','grass','tree','grass','water'];
function advTerrain(row, col){
  var h = ((row*13+col*7)*2654435761)|0; // 简单哈希
  return ADV_TERRAIN[((h>>>0)&0x7FFFFFFF) % ADV_TERRAIN.length];
}
function advPathCell(step){
  var row = Math.floor(step / ADV_COLS);
  var col = step % ADV_COLS;
  if(row % 2 === 1) col = ADV_COLS - 1 - col;
  return {row:row, col:col};
}
// 地标配置：每 15-25 步生成一个
var ADV_LANDMARK_EMOJIS = ['🌲','🌊','🏕️','⛰️','🏯','🌋','🌌','🏰','👑','🌸','🎪','🗿','🌺','🦋','🌈','🎠','🏝️','🌄','🎡','🪐'];
var ADV_LANDMARK_NAMES = ['密林入口','翡翠湖','露营地','青石山','幻影城','熔岩洞','星空之巅','天空王座','终点殿堂','樱花谷','幻彩马戏团','巨石阵','蔷薇花园','蝶谷','彩虹桥','旋转木马','遗忘之岛','晨曦山巅','摩天轮','星环'];
// 预生成地标（前 50 步固定, 之后每走一步检查是否需要新地标）
var ADV_LANDMARKS = [];
function advEnsureLandmarks(upToStep){
  var needed = Math.floor(upToStep / 15) + 1; // 每 15 步至少一个地标
  while(ADV_LANDMARKS.length < needed && ADV_LANDMARKS.length < ADV_LANDMARK_EMOJIS.length){
    var idx = ADV_LANDMARKS.length;
    var step = idx === 0 ? 5 : ADV_LANDMARKS[idx-1].step + 10 + Math.floor(Math.random()*10); // 8-18 步间隔
    ADV_LANDMARKS.push({step:step, emoji:ADV_LANDMARK_EMOJIS[idx], name:ADV_LANDMARK_NAMES[idx]});
  }
}
function adventureStep(){
  if(!state.adventure) state.adventure = {steps:0, unlocked:[], landmarksRecorded:0};
  state.adventure.steps = (state.adventure.steps||0) + 1;
  advEnsureLandmarks(state.adventure.steps);
  checkAdventureUnlocks(); saveState();
}
function adventureUnstep(){
  if(!state.adventure) return;
  state.adventure.steps = Math.max(0, (state.adventure.steps||0) - 1);
  saveState();
}
function checkAdventureUnlocks(){
  var s = state.adventure.steps||0;
  var unlocked = state.adventure.unlocked || [];
  var changed = false;
  for(var li=0;li<ADV_LANDMARKS.length;li++){
    var lm = ADV_LANDMARKS[li];
    if(s >= lm.step && !unlocked.includes(lm.step)){
      unlocked.push(lm.step);
      changed = true;
    }
  }
  if(changed) state.adventure.unlocked = unlocked;
}
// 预生成初始地标
advEnsureLandmarks(50);

function renderAdventureMap(full){
  var s = state.forest && state.forest.total || 0;
  var unlocked = state.adventure && state.adventure.unlocked || [];
  var totalCells = s; // 只显示已走过的格子（step < s）
  if(totalCells <= 0) return '';
  var totalRows = Math.ceil(totalCells / ADV_COLS);
  var startRow = full ? 0 : Math.max(0, totalRows-4);
  var endRow = totalRows;
  var html = '';
  var playerRow = -1;
  for(var r=startRow;r<endRow;r++){
    for(var c=0;c<ADV_COLS;c++){
      var step = r*ADV_COLS + c;
      var l2r = r % 2 === 0;
      var displayCol = l2r ? c : ADV_COLS-1-c;
      if(step >= s){
        html += '<div class="adv-cell gray"></div>'; continue;
      }
      var isPlayer = s > 0 && step === s - 1;
      var terrain = advTerrain(r, displayCol);
      var cls = 'adv-cell ' + terrain;
      var lmHtml = '';
      for(var li=0;li<ADV_LANDMARKS.length;li++){
        if(ADV_LANDMARKS[li].step-1 === step){
          var isLocked = !unlocked.includes(ADV_LANDMARKS[li].step);
          lmHtml = '<div class="lm'+(isLocked?' locked':'')+'">'+ADV_LANDMARKS[li].emoji+'</div>';
          break;
        }
      }
      var playerHtml = isPlayer ? '<div class="player">🧑</div>' : '';
      html += '<div class="'+cls+'">'+playerHtml+lmHtml+'</div>';
    }
  }
  return html;
}
renderers.adventure = function(){
  var s = state.forest&&state.forest.total||0;
  var unlocked = state.adventure&&state.adventure.unlocked||[];
  var nextLm = null;
  for(var li=0;li<ADV_LANDMARKS.length;li++){
    if(!unlocked.includes(ADV_LANDMARKS[li].step)){ nextLm=ADV_LANDMARKS[li]; break; }
  }
  return '<div class="page-head"><div><h2>🧭 像素世界冒险</h2><div class="sub">完成每日任务，探索无限像素世界！</div></div></div>'+
    '<div class="card">'+
      '<div class="card-title"><span class="ttl">🗺️ 冒险地图</span><span class="pill accent">'+s+' 步</span></div>'+
      (s > 0 ? '<div style="font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:.4rem">🧑 走过 <b style="color:var(--text)">'+s+'</b> 个格子，当前在第 <b style="color:var(--accent)">'+s+'</b> 格</div>' : '<div style="font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:.4rem">🏁 还没有走过格子，完成第一个任务出发吧！</div>')+
      '<div class="adv-wrap"><div class="adv-grid">'+renderAdventureMap(true)+'</div></div>'+
      '<div class="adv-lbar"><span class="it"><span class="sq" style="background:#8B7355"></span>已走</span><span class="it"><span style="color:#2d5a27">🌲</span>森林</span><span class="it"><span style="color:#2196F3">🌊</span>湖泊</span><span class="it"><span style="color:#607D8B">⛰️</span>山</span><span class="it"><span style="color:#ff5722">🌋</span>熔岩</span><span class="it"><span style="color:#7C4DFF">✨</span>巅峰</span></div>'+
    '</div>'+
    '<div class="card"><div class="card-title"><span class="ttl">🏆 发现地标</span><span class="pill accent">'+unlocked.length+'</span></div>'+
    (unlocked.length ? unlocked.slice().reverse().map(function(us){
      var lm = null;
      for(var li=0;li<ADV_LANDMARKS.length;li++){ if(ADV_LANDMARKS[li].step===us){ lm=ADV_LANDMARKS[li]; break; } }
      return lm ? '<div class="list-item"><div class="item-text"><div class="main">'+lm.emoji+' '+escapeHtml(lm.name)+'</div><div class="meta">第 '+lm.step+' 步解锁</div></div></div>' : '';
    }).join('') : '<div class="empty"><div class="ico">🧭</div>继续前进，发现新世界</div>')+
    '</div>'+
    (nextLm ? '<div class="card card-dark" style="text-align:center;padding:.8rem"><div style="font-size:.82rem;opacity:.7">下一个目标</div><div style="font-size:1.5rem;margin:.2rem 0">'+
      nextLm.emoji+' '+escapeHtml(nextLm.name)+'</div><div style="font-size:.8rem;opacity:.7">还需 '+(nextLm.step-s)+' 步</div><div style="margin-top:.4rem"><div class="progress-bar"><div class="progress-fill" style="width:'+Math.min(100,(s/nextLm.step)*100)+'%"></div></div></div></div>' : '');
};
initModule.adventure = function(){};

// ===== Boot =====
loadState();
initNav();
switchModule(state.settings.lastModule || 'home');
// 后台预加载天气（让天气数据在用户切到该模块前就开始获取）
setTimeout(function(){
  if(typeof loadWeather === 'function') loadWeather();
}, 100);
// 页面关闭时立即保存，避免 200ms debounce 来不及写入
function flushState(){
  Storage.set('settings', state.settings);
  Storage.set('forest', state.forest);
  Storage.set('daily', state.daily);
  Storage.set('english', state.english);
  Storage.set('collections', state.collections);
  Storage.set('bills', state.bills);
  Storage.set('homework', state.homework);
  Storage.set('books', state.books);
  Storage.set('kitchen', state.kitchen);
  Storage.set('diary', state.diary);
  Storage.set('weather', state.weather);
  Storage.set('timers', state.timers);
  Storage.set('habits', state.habits);
  Storage.set('adventure', state.adventure);
}
window.addEventListener('beforeunload', function(){ clearTimeout(saveTimer); flushState(); });

</script>
