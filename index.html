// ---- 各特效初始化器（忠实移植自 toolknit-desktop 视觉特效源码）----
function fxPlasma(ogl, el, opt){
  const { Renderer, Program, Mesh, Triangle } = ogl;
  const hexToRgb = hex => { const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); if(!r) return [1,0.5,0.2]; return [parseInt(r[1],16)/255,parseInt(r[2],16)/255,parseInt(r[3],16)/255]; };
  const vertex = '#version 300 es\nprecision highp float;\nin vec2 position;\nin vec2 uv;\nout vec2 vUv;\nvoid main(){ vUv=uv; gl_Position=vec4(position,0.0,1.0); }';
  const fragment = '#version 300 es\nprecision highp float;\nuniform vec2 iResolution; uniform float iTime;\nuniform vec3 uCustomColor; uniform float uUseCustomColor;\nuniform float uSpeed; uniform float uDirection; uniform float uScale; uniform float uOpacity;\nuniform vec2 uMouse; uniform float uMouseInteractive;\nout vec4 fragColor;\nvoid mainImage(out vec4 o, vec2 C){\n  vec2 center=iResolution.xy*0.5; C=(C-center)/uScale+center;\n  vec2 mouseOffset=(uMouse-center)*0.0002; C+=mouseOffset*length(C-center)*step(0.5,uMouseInteractive);\n  float i,d,z,T=iTime*uSpeed*uDirection; vec3 O,p,S;\n  for(vec2 r=iResolution.xy, Q; ++i<60.; O+=o.w/d*o.xyz){\n    p=z*normalize(vec3(C-.5*r,r.y)); p.z-=4.; S=p; d=p.y-T;\n    p.x+=.4*(1.+p.y)*sin(d+p.x*0.1)*cos(.34*d+p.x*0.05);\n    Q=p.xz*=mat2(cos(p.y+vec4(0,11,33,0)-T));\n    z+=d=abs(sqrt(length(Q*Q))-.25*(5.+S.y))/3.+8e-4;\n    o=1.+sin(S.y+p.z*.5+S.z-length(S-p)+vec4(2,1,0,8));\n  }\n  o.xyz=tanh(O/1e4);\n}\nbool finite1(float x){ return !(isnan(x)||isinf(x)); }\nvec3 sanitize(vec3 c){ return vec3(finite1(c.r)?c.r:0.0, finite1(c.g)?c.g:0.0, finite1(c.b)?c.b:0.0); }\nvoid main(){ vec4 o=vec4(0.0); mainImage(o, gl_FragCoord.xy); vec3 rgb=sanitize(o.rgb);\n  float intensity=(rgb.r+rgb.g+rgb.b)/3.0; vec3 customColor=intensity*uCustomColor;\n  vec3 finalColor=mix(rgb,customColor,step(0.5,uUseCustomColor));\n  float alpha=length(rgb)*uOpacity; fragColor=vec4(finalColor,alpha); }';
  const color = opt.color || '#B497CF';
  const renderer = new Renderer({ webgl:2, alpha:true, antialias:false, dpr: Math.min(window.devicePixelRatio||1,2) });
  const gl = renderer.gl; const canvas = gl.canvas;
  canvas.style.display='block'; canvas.style.width='100%'; canvas.style.height='100%';
  el.appendChild(canvas);
  const geometry = new Triangle(gl);
  const program = new Program(gl, { vertex, fragment, uniforms:{
    iTime:{value:0}, iResolution:{value:new Float32Array([1,1])},
    uCustomColor:{value:new Float32Array(hexToRgb(color))}, uUseCustomColor:{value:1.0},
    uSpeed:{value:(opt.speed||1)*0.4}, uDirection:{value:1.0}, uScale:{value:opt.scale||1},
    uOpacity:{value:opt.opacity||1}, uMouse:{value:new Float32Array([0,0])}, uMouseInteractive:{value:0.0}
  }});
  const mesh = new Mesh(gl, { geometry, program });
  const setSize = () => { const rect=el.getBoundingClientRect(); const w=Math.max(1,Math.floor(rect.width)), h=Math.max(1,Math.floor(rect.height)); renderer.setSize(w,h); const res=program.uniforms.iResolution.value; res[0]=gl.drawingBufferWidth; res[1]=gl.drawingBufferHeight; };
  const ro = new ResizeObserver(setSize); ro.observe(el); setSize();
  let raf=0; const t0=performance.now();
  const loop = t => { program.uniforms.iTime.value=(t-t0)*0.001; renderer.render({ scene:mesh }); raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); try { const e=gl.getExtension('WEBGL_lose_context'); if(e) e.loseContext(); } catch(_){} try { el.removeChild(canvas); } catch(_){} };
}

function fxPlasmaWave(ogl, el, opt){
  const { Renderer, Camera, Transform, Program, Mesh, Geometry } = ogl;

function fxDither(three, el, opt){
  const { waveSpeed=0.05, waveFrequency=3, waveAmplitude=0.3, waveColor=[0.5,0.5,0.5], colorNum=4, pixelSize=2 } = opt;
  const width=el.clientWidth||300, height=el.clientHeight||230;
  const renderer=new three.WebGLRenderer({ alpha:true, antialias:false, powerPreference:'high-performance' });
  renderer.setPixelRatio(1); renderer.setSize(width,height); el.appendChild(renderer.domElement);
  const scene=new three.Scene(); const camera=new three.OrthographicCamera(-1,1,1,-1,0,1);
  const uniforms={ resolution:{value:new three.Vector2(width,height)}, time:{value:0}, waveSpeed:{value:waveSpeed}, waveFrequency:{value:waveFrequency}, waveAmplitude:{value:waveAmplitude}, waveColor:{value:new three.Color(waveColor[0],waveColor[1],waveColor[2])}, colorNum:{value:colorNum}, pixelSize:{value:pixelSize} };
  const vShader='precision highp float; varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }';
  const fShader='precision highp float;\nuniform vec2 resolution; uniform float time; uniform float waveSpeed; uniform float waveFrequency; uniform float waveAmplitude; uniform vec3 waveColor; uniform float colorNum; uniform float pixelSize;\nvarying vec2 vUv;\nvec4 mod289(vec4 x){ return x-floor(x*(1.0/289.0))*289.0; }\nvec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }\nvec4 taylorInvSqrt(vec4 r){ return 1.79284291400159-0.85373472095314*r; }\nvec2 fade(vec2 t){ return t*t*t*(t*(t*6.0-15.0)+10.0); }\nfloat cnoise(vec2 P){ vec4 Pi=floor(P.xyxy)+vec4(0.0,0.0,1.0,1.0); vec4 Pf=fract(P.xyxy)-vec4(0.0,0.0,1.0,1.0); Pi=mod289(Pi); vec4 ix=Pi.xzxz; vec4 iy=Pi.yyww; vec4 fx=Pf.xzxz; vec4 fy=Pf.yyww; vec4 i=permute(permute(ix)+iy); vec4 gx=fract(i*(1.0/41.0))*2.0-1.0; vec4 gy=abs(gx)-0.5; vec4 tx=floor(gx+0.5); gx=gx-tx; vec2 g00=vec2(gx.x,gy.x); vec2 g10=vec2(gx.y,gy.y); vec2 g01=vec2(gx.z,gy.z); vec2 g11=vec2(gx.w,gy.w); vec4 norm=taylorInvSqrt(vec4(dot(g00,g00),dot(g01,g01),dot(g10,g10),dot(g11,g11))); g00*=norm.x; g01*=norm.y; g10*=norm.z; g11*=norm.w; float n00=dot(g00,vec2(fx.x,fy.x)); float n10=dot(g10,vec2(fx.y,fy.y)); float n01=dot(g01,vec2(fx.z,fy.z)); float n11=dot(g11,vec2(fx.w,fy.w)); vec2 fade_xy=fade(Pf.xy); vec2 n_x=mix(vec2(n00,n01),vec2(n10,n11),fade_xy.x); return 2.3*mix(n_x.x,n_x.y,fade_xy.y); }\nconst int OCTAVES=4;\nfloat fbm(vec2 p){ float value=0.0; float amp=1.0; float freq=waveFrequency; for(int i=0;i<OCTAVES;i++){ value+=amp*abs(cnoise(p)); p*=freq; amp*=waveAmplitude; } return value; }\nfloat pattern(vec2 p){ vec2 p2=p-time*waveSpeed; return fbm(p+fbm(p2)); }\nfloat Bayer2(vec2 a){ a=floor(a); return fract(a.x/2.0+a.y*a.y*0.75); }\n#define Bayer4(a) (Bayer2(0.5*(a))*0.25+Bayer2(a))\n#define Bayer8(a) (Bayer4(0.5*(a))*0.25+Bayer2(a))\nvec3 dither(vec2 uv, vec3 color){ vec2 sc=floor(uv*resolution/pixelSize); int x=int(mod(sc.x,8.0)); int y=int(mod(sc.y,8.0)); float threshold=Bayer8(vec2(x,y))-0.25; float stepv=1.0/(colorNum-1.0); color+=threshold*stepv; float bias=0.2; color=clamp(color-bias,0.0,1.0); return floor(color*(colorNum-1.0)+0.5)/(colorNum-1.0); }\nvoid main(){ vec2 uv=gl_FragCoord.xy/resolution.xy; uv-=0.5; uv.x*=resolution.x/resolution.y; float f=pattern(uv); vec3 col=mix(vec3(0.0),waveColor,f); col=dither(gl_FragCoord.xy,col); gl_FragColor=vec4(col,1.0); }';
  const geometry=new three.PlaneGeometry(2,2); const material=new three.ShaderMaterial({ vertexShader:vShader, fragmentShader:fShader, uniforms }); const mesh=new three.Mesh(geometry,material); scene.add(mesh);
  const resize=()=>{ const w=el.clientWidth||300, h=el.clientHeight||230; renderer.setSize(w,h); uniforms.resolution.value.set(w,h); };
  const ro=new ResizeObserver(resize); ro.observe(el);
  const start=performance.now(); let raf;
  const animate=now=>{ uniforms.time.value=(now-start)*0.001; renderer.render(scene,camera); raf=requestAnimationFrame(animate); };
  raf=requestAnimationFrame(animate);
  return ()=>{ cancelAnimationFrame(raf); ro.disconnect(); if(renderer.domElement.parentNode===el) el.removeChild(renderer.domElement); material.dispose(); geometry.dispose(); renderer.dispose(); };
}

function bindToolsUI(){
  const tt=$('#ttInput');
  if(tt) tt.addEventListener('input', ()=>{ const v=tt.value; $('#ttChars').textContent=v.length; $('#ttNoSpace').textContent=v.replace(/\s/g,'').length; $('#ttWords').textContent=(v.trim().match(/\S+/g)||[]).length; $('#ttLines').textContent=(v===''?0:v.split(/\n/).length); });
  const tf=$('#tfInput');
  if(tf) $$('.tf-btn').forEach(b=> b.addEventListener('click', ()=>{ let v=tf.value; switch(b.dataset.tf){ case 'upper': v=v.toUpperCase(); break; case 'lower': v=v.toLowerCase(); break; case 'trim': v=v.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(); break; case 'noblank': v=v.split('\n').filter(l=>l.trim()!=='').join('\n'); break; case 'reverse': v=v.split('').reverse().join(''); break; } tf.value=v; toast('已应用：'+b.textContent); }));
  const tsDate=$('#tsDate'), tsSec=$('#tsSec');
  function tsFromDate(){ if(!tsDate||!tsSec||!tsDate.value) return; const d=new Date(tsDate.value); if(isNaN(d)) return; tsSec.value=Math.floor(d.getTime()/1000); $('#tsUtc').textContent=d.toISOString(); $('#tsLocal').textContent=d.toLocaleString(); }
  function tsFromSec(){ if(!tsDate||!tsSec||!tsSec.value) return; const s=parseInt(tsSec.value,10); if(isNaN(s)) return; const d=new Date(s*1000); tsDate.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); $('#tsUtc').textContent=d.toISOString(); $('#tsLocal').textContent=d.toLocaleString(); }
  if(tsDate){ tsDate.addEventListener('change', tsFromDate); tsSec.addEventListener('input', tsFromSec); const now=new Date(); const off=now.getTimezoneOffset(); const local=new Date(now.getTime()-off*60000); tsDate.value=local.toISOString().slice(0,16); tsFromDate(); }
  const bmiH=$('#bmiH'), bmiW=$('#bmiW');
  function calcBmi(){ if(!bmiH||!bmiW) return; const h=parseFloat(bmiH.value)/100, w=parseFloat(bmiW.value); if(!h||!w){ $('#bmiOut').textContent='—'; $('#bmiCat').textContent=''; return; } const bmi=w/(h*h); $('#bmiOut').textContent=bmi.toFixed(1); let cat='',col=''; if(bmi<18.5){cat='偏瘦';col='#2196F3';} else if(bmi<24){cat='正常';col='#4CAF50';} else if(bmi<28){cat='偏胖';col='#FF9800';} else {cat='肥胖';col='#F44336';} $('#bmiCat').textContent=cat; $('#bmiCat').style.color=col; }
  if(bmiH){ bmiH.addEventListener('input',calcBmi); bmiW.addEventListener('input',calcBmi); calcBmi(); }
  const cp=$('#cpInput'), cpHex=$('#cpHex'), cpRgb=$('#cpRgb');
  function updCp(){ if(!cp) return; const hex=cp.value; cpHex.textContent=hex.toUpperCase(); const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16); cpRgb.textContent='rgb('+r+','+g+','+b+')'; $('#cpSwatch').style.background=hex; }
  if(cp){ cp.addEventListener('input',updCp); updCp(); const cpCopy=$('#cpCopy'); if(cpCopy) cpCopy.addEventListener('click',()=>copyText(cpHex.textContent)); const cpEye=$('#cpEye'); if(cpEye){ if(window.EyeDropper){ cpEye.style.display=''; cpEye.addEventListener('click',async()=>{ try{ const ed=new EyeDropper(); const res=await ed.open(); cp.value=res.sRGBHex; updCp(); }catch(e){} }); } else { cpEye.style.display='none'; } } }
  const sample=$('#typingSample') ? $('#typingSample').textContent : '';
  const tInput=$('#typingInput'); let tStart=0;
  function typingReset(){ tStart=0; if(tInput) tInput.value=''; $('#typingWpm').textContent='—'; $('#typingAcc').textContent='—'; }
  if(tInput) tInput.addEventListener('input', ()=>{ if(!tStart) tStart=performance.now(); const typed=tInput.value; const el2=$('#typingWpm'); if(typed.length===0){ el2.textContent='—'; $('#typingAcc').textContent='—'; return; } const elapsed=(performance.now()-tStart)/60000; let correct=0; for(let i=0;i<typed.length;i++){ if(typed[i]===sample[i]) correct++; } const acc=correct/typed.length; const wpm=elapsed>0?(typed.length/5)/elapsed:0; el2.textContent=Math.round(wpm); $('#typingAcc').textContent=Math.round(acc*100)+'%'; if(typed.length>=sample.length) toast('完成！速度 '+Math.round(wpm)+' WPM，正确率 '+Math.round(acc*100)+'%'); });
  const tReset=$('#typingReset'); if(tReset) tReset.addEventListener('click',typingReset);
}

let toolsGen = 0;
initModule.tools = function(){
  toolsGen++;
  const myGen = toolsGen;
  runCleanup('tools');
  bindToolsUI();
  Promise.all([getOgl(), getThree()]).then(function(res){
    if (myGen !== toolsGen) return;          // 已被重渲染，丢弃过期结果
    if (currentModule !== 'tools') return;
    const ogl=res[0], three=res[1];
    if (!ogl && !three){ ['fx-plasma','fx-plasmawave','fx-ferrofluid','fx-lightrays','fx-darkveil','fx-dither'].forEach(id=>{ const e=document.getElementById(id); if(e) e.innerHTML='<div class="fx-fallback">渲染库加载失败，请检查网络 😢</div>'; }); return; }
    initFx(ogl, three);
  });
};

function initFx(ogl, three){
  function mount(id, fn){
    const el=document.getElementById(id); if(!el) return;
    let cleanup=null;
    try { cleanup=fn(el); } catch(e){ console.warn('特效初始化失败:', id, e); }
    if (cleanup) moduleCleanups.tools.push(cleanup);
    else el.innerHTML='<div class="fx-fallback">该特效需要 WebGL，当前环境不可用 😢</div>';
  }
  if (ogl){
    mount('fx-plasma', el => fxPlasma(ogl, el, { color:'#7C4DFF', speed:1.2 }));
    mount('fx-plasmawave', el => fxPlasmaWave(ogl, el, { colors:['#7C4DFF','#06B6D4'] }));
    mount('fx-ferrofluid', el => fxFerrofluid(ogl, el, { colors:['#80C3EA','#25637B','#ffffff'], flowDirection:'down' }));
    mount('fx-lightrays', el => fxLightRays(ogl, el, { raysColor:'#ffffff', raysOrigin:'top-center', followMouse:true, mouseInfluence:0.12 }));
    mount('fx-darkveil', el => fxDarkVeil(ogl, el, { hueShift:30, noiseIntensity:0.03, warpAmount:0.4 }));
  } else {
    ['fx-plasma','fx-plasmawave','fx-ferrofluid','fx-lightrays','fx-darkveil'].forEach(id=>{ const e=document.getElementById(id); if(e) e.innerHTML='<div class="fx-fallback">ogl 库加载失败 😢</div>'; });
  }
  if (three){
    mount('fx-dither', el => fxDither(three, el, { waveColor:[0.49,0.30,0.77], colorNum:4, pixelSize:3 }));
  } else {
    const e=document.getElementById('fx-dither'); if(e) e.innerHTML='<div class="fx-fallback">three 库加载失败 😢</div>';
  }
}

  Storage.set('english', state.english);
  Storage.set('collections', state.collections);

  Storage.set('homework', state.homework);
  Storage.set('books', state.books);
  Storage.set('kitchen', state.kitchen);
  Storage.set('diary', state.diary);
  Storage.set('weather', state.weather);
  Storage.set('timers', state.timers);
  Storage.set('habits', state.habits);
  Storage.set('adventure', state.adventure);
}
window.addEventListener('beforeunload', function(){ clearTimeout(saveTimer); flushState(); });
