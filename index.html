<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Genzy 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="" id="appIconLink">
<link rel="manifest" href="" id="manifestLink">
<style>
/* ===== Galaxy-inspired Theme (融合 Galaxy + iOS) ===== */
:root {
  /* Galaxy 品牌色 */
  --galaxy-primary: #25537b;
  --galaxy-dark: #2c3143;
  --galaxy-light: #f8f9fa;
  --galaxy-border: #dee2e6;
  --galaxy-gold: #ffd700;

  /* Light 模式 */
  --bg: #f0f2f5;
  --card: #ffffff;
  --card-2: #f8f9fa;
  --card-dark: #2c3143;
  --text: #191919;
  --muted: #63656d;
  --border: rgba(0,0,0,0.08);
  --accent: #25537b;
  --accent-soft: rgba(37,83,123,0.12);
  --danger: #e31a1e;
  --success: #66cc66;
  --warning: #fe7f02;
  --shadow: 0 1px 4px rgba(0,0,0,0.06);
  --shadow-dark: 0 4px 16px rgba(0,0,0,0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --sidebar-w: 240px;
  --touch: 44px;
  --pixel: 'Press Start 2P', cursive;
  --body: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1d23;
    --card: #23262f;
    --card-2: #2c3143;
    --card-dark: #f8f9fa;
    --text: #f0f2f5;
    --muted: #aab0b4;
    --border: rgba(255,255,255,0.08);
    --accent: #80c3ea;
    --accent-soft: rgba(128,195,234,0.18);
    --danger: #f33b36;
    --success: #98e192;
    --warning: #ff9b2f;
    --shadow: 0 1px 6px rgba(0,0,0,0.35);
    --shadow-dark: 0 4px 20px rgba(0,0,0,0.55);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
}
.pixel { font-family: var(--pixel); line-height: 1.4; letter-spacing: -.5px; }
button, input, select, textarea {
  font-family: inherit; font-size: 1rem; color: inherit;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; opacity: .5; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== Layout ===== */
#app { display:flex; min-height:100vh; }
#sidebar {
  position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w);
  background: var(--card);
  display:flex; flex-direction:column; z-index:100;
  transform: translateX(0); transition: transform .25s ease;
  color: var(--text);
  border-right: 1px solid var(--border);
  box-shadow: var(--shadow);
}
#sidebar .brand {
  padding: 1.2rem 1rem .8rem; display:flex; align-items:center; gap:.7rem;
  border-bottom: 1px solid var(--border);
}
#sidebar .brand .logo {
  width: 34px; height: 34px; background: var(--accent);
  color: #fff; display:grid; place-items:center; border-radius: 8px;
  font-family: var(--pixel); font-size: .55rem; box-shadow: 0 1px 6px rgba(0,0,0,.25);
}
#sidebar .brand h1 { font-size: 1rem; margin:0; font-weight: 700; color: var(--text); letter-spacing: -.2px; }
#sidebar .brand small { font-size: .65rem; color: var(--muted); display:block; margin-top:.05rem; }
#nav { flex:1; overflow-y:auto; padding: .4rem .6rem; }
.nav-item {
  display:flex; align-items:center; gap:.6rem;
  padding: .6rem .7rem; margin-bottom: 2px;
  border-radius: 8px;
  cursor: pointer; min-height: 36px;
  transition: background .12s, color .12s;
  font-weight: 500; color: var(--text);
  font-size: .85rem;
}
.nav-item:hover { background: var(--accent-soft); color: var(--accent); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item .icon { font-size: 1rem; width: 22px; text-align:center; }
.nav-item .label { font-size: .85rem; }
.nav-cat {
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  padding: .5rem .7rem; margin-bottom: 1px;
  border-radius: 8px;
  cursor: pointer; min-height: 34px;
  transition: background .12s, color .12s;
  font-weight: 600; font-size: .72rem; color: var(--muted);
  user-select:none; letter-spacing: .3px;
}
.nav-cat:hover { background: var(--card-2); color: var(--text); }
.nav-cat:first-child { margin-top:0; }
.nav-cat .icon { font-size:.85rem;width:22px;text-align:center;display:inline-block; }
.nav-cat .arrow { font-size:.5rem; color: var(--muted); transition:transform .2s; }
.nav-cat .arrow.collapsed { transform:rotate(-90deg); }
.nav-items { overflow:hidden; transition:max-height .2s ease; max-height:1000px; }
.nav-items.collapsed { max-height:0; }
.nav-items .nav-item { padding-left:1.1rem; }
#sidebar .foot { padding: .8rem; font-size: .6rem; color: var(--muted); text-align:center; border-top:1px solid var(--border); }

#main {
  flex:1; margin-left: var(--sidebar-w); min-height:100vh;
  padding: 1.6rem 1.6rem 5rem;
  max-width: 720px;
}
#topbar {
  display:none; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:90;
  padding: .7rem 0; margin: -1.6rem -1.6rem 1rem -1.6rem;
  padding-left: 1.6rem; padding-right: 1.6rem;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
#menuBtn {
  position:relative; width:34px; height:34px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; transition-duration:.3s;
  background: var(--card-2); border-radius:8px; border:none; padding:0 5px;
}
#menuBtn .bar {
  width:100%; height:3px; background:var(--text); border-radius:3px;
  transition-duration:.3s;
}
#menuBtn.open { transform:rotate(-90deg); }
#menuBtn.open .bar:nth-child(1) {
  transform:translateY(18px) rotate(-60deg); transform-origin:left; z-index:1;
}
#menuBtn.open .bar:nth-child(2) {
  transform:translateY(9px) rotate(60deg); transform-origin:right; z-index:2;
}
#menuBtn.open .bar:nth-child(3) { opacity:0; }
#overlay {
  display:none; position:fixed; inset:0; background: rgba(0,0,0,.4); z-index:99;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
@media (max-width: 768px) {
  #sidebar { transform: translateX(-110%); width: min(78vw, 280px); box-shadow: var(--shadow-dark); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left:0; padding: 1rem 1rem 5rem; max-width: 100%; }
  #topbar { display:flex; }
  #overlay.show { display:block; }
  .page-title { font-size: 1rem; }
}

/* ===== Page header ===== */
.page-head {
  display:flex; align-items:flex-end; justify-content:space-between;
  margin: -.4rem 0 1rem 0;
}
.page-head h2 {
  margin:0; font-size: 1.9rem; font-weight: 800; letter-spacing: -.8px;
}
.page-head .sub {
  color: var(--muted); font-size: .85rem; font-weight: 500;
}

/* ===== Cards (Galaxy card-container style) ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: .9rem 1rem;
  margin-bottom: .7rem;
  border: 1px solid var(--border);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card-dark {
  background: var(--card-dark);
  color: var(--card-2);
  border-color: transparent;
}
.card-dark .card-subtitle, .card-dark .muted { color: rgba(255,255,255,0.65); }
.card-tight { padding: .65rem .85rem; }
.card-title {
  font-size: .85rem; font-weight: 700;
  margin: 0 0 .6rem 0;
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  letter-spacing: -.1px;
}
.card-title .ttl { display:flex; align-items:center; gap:.4rem; }
.card-subtitle { font-size: .78rem; color: var(--muted); margin: -.3rem 0 .6rem 0; line-height: 1.45; }

/* ===== Hero number (for big stats) ===== */
.num-hero {
  font-size: 3.4rem; font-weight: 800; letter-spacing: -2px;
  line-height: 1; font-feature-settings: "tnum" 1;
}
.num-xl { font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; }
.num-lg { font-size: 1.5rem; font-weight: 700; letter-spacing: -.5px; }
.unit { font-size: .9rem; color: var(--muted); margin-left: .2rem; font-weight: 500; }

/* ===== Buttons (Galaxy inspired) ===== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
  min-height: 36px; min-width: 36px;
  padding: .45rem .85rem; border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-2); color: var(--text); font-weight: 600; cursor: pointer;
  font-size: .85rem; transition: background .12s, color .12s, filter .1s, transform .15s;
}
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn:active:not(:disabled) { transform: scale(0.95) rotateZ(1.7deg); filter: brightness(.94); }
.btn.secondary { background: var(--card-2); color: var(--text); border-color: var(--border); }
.btn.accent { background: var(--accent); color: #fff; border-color: transparent; position:relative; overflow:hidden; }
.btn.accent::after { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); transition:left .6s; pointer-events:none; }
.btn.accent:hover::after { left:100%; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }

/* From Uiverse.io by vinodjangid07 - animated trash button */
.btn-trash {
  width: 36px; height: 36px; border-radius: 50%; padding:0; display:inline-flex;
  align-items:center; justify-content:center; border:none; cursor:pointer;
  background: rgb(20,20,20); transition:background .3s, transform .15s;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
  position:relative; flex-shrink:0;
}
.btn-trash:hover { background: rgb(255,69,69); }
.btn-trash:active { transform:scale(.92); }
.btn-trash svg { width:14px; }
.btn-trash svg path { fill:#fff; }
.btn-trash .bin-top { transform-origin:bottom right; }
.btn-trash:hover .bin-top { transition:transform .5s; transform:rotate(160deg); }
.btn.success { background: var(--success); color: #fff; border-color: transparent; }
.btn.warning { background: var(--warning); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; color: var(--accent); border-color: transparent; }
.btn-block { width: 100%; }
.btn-sm { min-height: 32px; padding: .3rem .65rem; font-size: .78rem; border-radius: 7px; }
.btn-lg { min-height: 44px; font-size: .95rem; padding: .55rem 1rem; }

/* ===== Inputs (Galaxy inspired) ===== */
.input, .select, .textarea {
  width:100%; min-height: 36px; border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card); padding: .45rem .7rem; outline:none;
  color: var(--text); font-size: .85rem; transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: vertical; min-height: 80px; line-height: 1.5; padding: .5rem .7rem; }
.input[type=date], .input[type=time], .input[type=month] { padding-right: .5rem; }
.form-row { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom: .6rem; align-items:flex-end; }
.form-row .input, .form-row .select { flex:1; min-width: 100px; }
label { display:block; font-size: .72rem; font-weight: 600; margin-bottom: .3rem; color: var(--muted); letter-spacing: .15px; }
.form-group { margin-bottom: .6rem; }
.form-grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
@media (max-width: 480px) { .form-grid-2 { grid-template-columns: 1fr; } }

/* ===== Lists (Galaxy card-item style) ===== */
.list-item {
  display:flex; align-items:center; gap:.65rem; padding: .6rem .7rem;
  background: var(--card-2); border-radius: 8px;
  margin-bottom: .35rem; transition: background .12s, opacity .15s;
}
.list-item:active { background: var(--border); }
.list-item.done { opacity: .5; }
.list-item.done .item-text { text-decoration: line-through; }
.list-item.bare { background: transparent; padding: .4rem 0; }

/* iOS-style circular checkbox */
.checkbox {
  width: 24px; height: 24px; border: 2px solid color-mix(in srgb, var(--text) 30%, transparent);
  border-radius: 50%;
  display:grid; place-items:center; cursor:pointer; flex-shrink:0;
  background: transparent; transition: background .15s, border-color .15s;
}
.checkbox.checked {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.checkbox svg { width: 14px; height: 14px; }
.item-text { flex:1; word-break:break-word; min-width: 0; }
.item-text .main { font-weight: 500; font-size: .95rem; }
.item-text .meta { font-size: .75rem; color: var(--muted); margin-top: .15rem; display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
.item-actions { display:flex; gap:.3rem; flex-shrink: 0; }

/* ===== Empty state ===== */
.empty {
  text-align:center; color: var(--muted); padding: 2rem .5rem;
  font-size: .88rem;
}
.empty .ico { font-size: 1.8rem; opacity: .5; margin-bottom: .4rem; }

/* ===== Progress bar ===== */
.progress-bar {
  height: 8px; background: color-mix(in srgb, var(--text) 8%, transparent);
  border-radius: 99px; overflow:hidden;
}
.progress-fill {
  height:100%; background: var(--success); width:0%;
  transition: width .4s cubic-bezier(.4,0,.2,1);
  border-radius: 99px;
}

/* ===== Pills (Galaxy badge style) ===== */
.pill {
  display:inline-flex; align-items:center; gap:.2rem; padding: .15rem .5rem;
  background: var(--card-2); border-radius: 6px; font-size: .68rem; font-weight: 600;
  border: 1px solid var(--border);
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.danger { background: rgba(227,26,30,0.12); color: var(--danger); border-color: transparent; }
.pill.success { background: rgba(102,204,102,0.15); color: var(--success); border-color: transparent; }

/* ===== Home (首页) ===== */
.home-clock { padding: .3rem 0 .7rem; }
.home-clock .flip-clock { background: linear-gradient(135deg, #1c1c1e, #2c2c2e); min-height:110px; }
.home-clock .flip-digit { width:50px; height:78px; font-size:58px; line-height:78px; }
.home-clock .flip-digit .digit-text { height:78px; line-height:78px; }
.home-clock .flip-digit-small { width:16px; height:22px; font-size:16px; line-height:22px; }
.home-clock .flip-digit-small .digit-text { height:22px; line-height:22px; }

.home-row2 { display:flex; gap:.6rem; margin-bottom:.9rem; }
.home-card-sm {
  flex:1; min-width:0;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: .7rem .8rem;
  cursor:pointer; transition:transform .08s;
}
.home-card-sm:active { transform: scale(.98); }
.home-card-sm .lbl { font-size:.65rem; color:var(--muted); font-weight:600; margin-bottom:.35rem; }
.home-card-sm .big { font-size:2rem; font-weight:800; letter-spacing:-1px; line-height:1; }

/* Mini calendar inside mood card */
.mini-cal { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; text-align:center; font-size:.6rem; }
.mini-cal .mc-dow { color:var(--muted); font-weight:600; padding:.1rem 0; }
.mini-cal .mc-day { padding:.1rem 0; border-radius:4px; color:var(--text); font-weight:500; line-height:1.3; }
.mini-cal .mc-day.mc-today { background:var(--accent); color:#fff; font-weight:700; }
.mini-cal .mc-day.mc-other { color:color-mix(in srgb, var(--text) 30%, transparent); }
.mini-cal .mc-day .mc-mood { font-size:.5rem; display:block; line-height:1; }

.home-wx {
  background: linear-gradient(135deg, rgba(37,83,123,0.12) 0%, rgba(44,49,67,0.08) 100%);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 22px;
  padding: 1.1rem 1.2rem;
  color: var(--text); display:flex; align-items:center; justify-content:space-between;
  margin-bottom: .9rem; cursor:pointer; transition: transform .2s, box-shadow .2s;
  position:relative; overflow:hidden;
  box-shadow: 0 4px 24px rgba(37,83,123,0.08);
}
.home-wx:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(37,83,123,0.15); }
.home-wx:active { transform: scale(.99); }
.home-wx::before {
  content:''; position:absolute; top:-50%; right:-50%; width:100%; height:100%;
  background: radial-gradient(circle, rgba(37,83,123,0.06) 0%, transparent 70%);
  pointer-events:none;
}
.home-wx .left { display:flex; flex-direction:column; gap:.2rem; z-index:1; }
.home-wx .temp { font-size: 4.5rem; font-weight: 200; line-height: 1; letter-spacing: -3px; }
.home-wx .city { font-size: 1rem; font-weight: 600; }
.home-wx .cond { font-size: 1.15rem; font-weight: 500; opacity:.85; }
.home-wx .hilo { font-size: .85rem; opacity:.7; margin-top:.2rem; }
.home-wx .right .wx-emoji { font-size: 4.5rem; line-height: 1; opacity:.9; }
@media (prefers-color-scheme: dark) {
  .home-wx { background: linear-gradient(135deg, rgba(37,83,123,0.25) 0%, rgba(44,49,67,0.3) 100%); border-color: rgba(255,255,255,0.08); box-shadow: 0 4px 24px rgba(0,0,0,.3); }
  .home-wx:hover { box-shadow: 0 8px 32px rgba(0,0,0,.4); }
}

/* Uiverse toggle switch by JaydipPrajapati1910 */
.toggle-u {
  background: rgba(0,0,0,0.2); border-radius:18px; border:2px solid rgba(58,58,58,0.1);
  box-shadow:0 0 3px rgba(0,0,0,0.4) inset;
  height:26px; margin:0; position:relative; width:60px;
  display:inline-block; user-select:none; flex-shrink:0;
}
.toggle-u input { position:absolute; visibility:hidden; }
.toggle-u label {
  cursor:pointer; display:block; height:22px; text-indent:-9999px; width:56px; user-select:none;
}
.toggle-u label:before {
  background: -webkit-radial-gradient(45%, circle, rgb(255,58,58) 0%, rgb(255,113,113) 100%);
  border-radius:6px; border:1px solid #742323;
  box-shadow:0 1px 2px rgba(255,67,48,0.4), 0 0 2px rgba(255,159,109,0.3) inset;
  content:""; display:block; height:5px; left:-16%; position:absolute; top:9px;
  transition:all .2s; width:5px; z-index:12;
}
.toggle-u label:after {
  background: -moz-radial-gradient(45%, circle, rgba(60,60,60,0.6) 0%, rgba(151,151,151,0.6) 100%);
  border-radius:6px; border:1px solid #111;
  box-shadow:0 1px 2px rgba(20,20,20,0.3);
  content:""; display:block; height:5px; right:-16%; position:absolute; top:9px;
  transition:all .2s; width:5px; z-index:12;
}
.toggle-u label span {
  background:linear-gradient(#4f4f4f,#2b2b2b); border-radius:30px;
  border:1px solid #1a1a1a;
  box-shadow:0 0 2px rgba(0,0,0,0.4), 0 1px 1px rgba(255,255,255,0.08) inset, 0 -1px 0 rgba(0,0,0,0.2) inset;
  display:block; height:20px; left:1px; position:absolute; top:1px;
  transition:all .2s linear; width:26px;
}
.toggle-u label span:before {
  background:linear-gradient(left, rgba(48,48,48,0.4), rgba(34,34,34,0.4));
  border-radius:30px 6px 6px 30px;
  box-shadow:-1px 0 2px rgba(0,0,0,0.2) inset;
  content:""; display:block; height:16px; left:1px; position:absolute; top:1px; width:11px;
}
.toggle-u label span:after {
  background:linear-gradient(right, rgba(48,48,48,0.4), rgba(34,34,34,0.4));
  border-radius:6px 30px 30px 6px;
  box-shadow:1px 0 2px rgba(0,0,0,0.2) inset;
  content:""; display:block; height:16px; position:absolute; right:1px; top:1px; width:11px;
}
.toggle-u input:checked + label span { left:31px; }
.toggle-u input:checked + label:before {
  background: -webkit-radial-gradient(45%, circle, rgba(60,60,60,0.6) 0%, rgba(151,151,151,0.6) 100%);
  border:1px solid #111; box-shadow:0 1px 2px rgba(20,20,20,0.3);
}
.toggle-u input:checked + label:after {
  background: -webkit-radial-gradient(45%, circle, lightgreen 0%, lightgreen 100%);
  border:1px solid #004562; box-shadow:0 1px 2px green, 0 0 2px green inset;
}

/* From Uiverse.io by cuzpq — 习惯模块平滑切换开关 */
.theme-checkbox {
  --toggle-size: 11px;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 6.25em;
  height: 3.125em;
  background: -webkit-gradient(linear, left top, right top, color-stop(50%, #efefef), color-stop(50%, #2a2a2a)) no-repeat;
  background: -o-linear-gradient(left, #efefef 50%, #2a2a2a 50%) no-repeat;
  background: linear-gradient(to right, #efefef 50%, #2a2a2a 50%) no-repeat;
  background-size: 205%;
  background-position: 0;
  -webkit-transition: 0.4s;
  -o-transition: 0.4s;
  transition: 0.4s;
  border-radius: 99em;
  position: relative;
  cursor: pointer;
  font-size: var(--toggle-size);
  flex-shrink: 0;
}

.theme-checkbox::before {
  content: "";
  width: 2.25em;
  height: 2.25em;
  position: absolute;
  top: 0.438em;
  left: 0.438em;
  background: -webkit-gradient(linear, left top, right top, color-stop(50%, #efefef), color-stop(50%, #2a2a2a)) no-repeat;
  background: -o-linear-gradient(left, #efefef 50%, #2a2a2a 50%) no-repeat;
  background: linear-gradient(to right, #efefef 50%, #2a2a2a 50%) no-repeat;
  background-size: 205%;
  background-position: 100%;
  border-radius: 50%;
  -webkit-transition: 0.4s;
  -o-transition: 0.4s;
  transition: 0.4s;
}

.theme-checkbox:checked::before {
  left: calc(100% - 2.25em - 0.438em);
  background-position: 0;
}

.theme-checkbox:checked {
  background-position: 100%;
}


/* From Uiverse.io by elijahgummer - task checkbox wipe */
.checkbox-uw {
  display:flex; align-items:center; justify-content:center; position:relative;
  cursor:pointer; user-select:none; flex-shrink:0;
  border:2px solid var(--accent); border-radius:8px; overflow:hidden;
  width:26px; height:26px;
}
.checkbox-uw input { position:absolute; opacity:0; cursor:pointer; height:0; width:0; }
.checkbox-uw .mark {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:var(--accent); border-radius:6px;
  box-shadow:0 0 2px var(--accent-soft), inset 0 -2px 3px rgba(255,255,255,0.3), inset 0 2px 3px rgba(0,0,0,0.2);
}
.checkbox-uw .mark:before {
  content:""; position:absolute; left:7px; top:3px; width:5px; height:10px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
  box-shadow:0 2px 2px rgba(0,0,0,0.2);
}
.checkbox-uw input:not(:checked) ~ .mark { transform:translateY(100%); }
.checkbox-uw input:checked ~ .mark { animation:ckUp .35s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes ckUp { 0%{transform:translateY(100%)} 100%{transform:translateY(0)} }

.adv-cell.walked { background:#8B7355; }
.adv-cell.grass { background:#7ec850; }
.adv-cell.tree { background:#3d8b37; }
.adv-cell.water { background:#4fc3f7; }
.adv-cell.mountain { background:#c7956b; }
.adv-cell.lava { background:#ff7043; }
.adv-cell.peak { background:#b388ff; }
.adv-cell .player { position:absolute; inset:0; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; z-index:2; background:rgba(255,255,255,.15); box-shadow:inset 0 0 0 2px rgba(255,255,255,.5); }
@keyframes pulse { 50% { box-shadow:0 0 0 3px var(--accent),0 0 20px var(--accent-soft); } }

.adv-cell .lm.locked { filter:grayscale(1) opacity(.35); }

  .adv-cell.water { background:#2980b9; }

/* ===== Flip clock (split-flap design) ===== */
.flip-clock {
  background: #000;
  border-radius: 22px;
  padding: .9rem 1rem;
  display: flex;
  align-items: center;
  width: 100%;
  box-sizing: border-box;
  overflow: hidden;
  color: #fff;
  margin: .5rem 0;
  position: relative;
  min-height: 130px;
}
.flip-clock-main {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  gap: .3rem;
}
.flip-clock-seconds {
  position: absolute;
  bottom: .55rem;
  right: .7rem;
  display: flex;
  gap: .08rem;
  z-index: 4;
}
.flip-pair { display: flex; gap: .15rem; }
.flip-digit {
  position: relative;
  width: 64px;
  height: 95px;
  background: #1c1c1e;
  border-radius: 12px;
  overflow: hidden;
  perspective: 600px;
  font-family: var(--body);
  font-size: 72px;
  font-weight: 700;
  color: #aaaebc;
  line-height: 95px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}
.flip-digit::before {
  content: '';
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: 1px;
  margin-top: -.5px;
  background: rgba(0,0,0,.6);
  z-index: 3;
  pointer-events: none;
}
.flip-digit-small {
  width: 18px;
  height: 26px;
  font-size: 18px;
  line-height: 26px;
  border-radius: 4px;
}
.flip-digit-small::before { height: 1px; }
.flip-half {
  position: absolute;
  left: 0; right: 0;
  height: 50%;
  overflow: hidden;
  background: #1c1c1e;
}
.flip-half .digit-text {
  position: absolute;
  left: 0; right: 0;
  height: 95px;
  line-height: 95px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}
.flip-digit-small .flip-half .digit-text {
  height: 26px;
  line-height: 26px;
}
.flip-top { top: 0; }
.flip-top .digit-text { top: 0; }
.flip-bottom { bottom: 0; }
.flip-bottom .digit-text { bottom: 0; }
.flip-flap {
  position: absolute;
  left: 0; right: 0;
  top: 0; height: 50%;
  background: #1c1c1e;
  overflow: hidden;
  transform-origin: bottom center;
  z-index: 2;
  backface-visibility: hidden;
  transform: rotateX(0deg);
}
.flip-flap .digit-text {
  position: absolute;
  top: 0;
  left: 0; right: 0;
  height: 95px;
  line-height: 95px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}
.flip-digit-small .flip-flap .digit-text {
  height: 26px;
  line-height: 26px;
}
.flip-flap.flipping { animation: flipTop .55s ease-in forwards; }
@keyframes flipTop {
  0% { transform: rotateX(0deg); }
  100% { transform: rotateX(-180deg); }
}

/* ===== Forest (Daily Plan trees) ===== */
.forest-scene {
  position: relative;
  width: 100%;
  height: 360px;
  border-radius: var(--radius);
  overflow: hidden;
  background:
    linear-gradient(to bottom,
      #f4ede0 0%,
      #ecf3e8 22%,
      #c5e0d0 28%,
      #92c8b3 38%,
      #7bb89f 65%,
      #6aa890 100%
    );
  box-shadow: inset 0 -30px 40px rgba(0,0,0,0.18), var(--shadow);
  cursor: pointer;
  user-select: none;
}
.forest-scene .horizon {
  position: absolute; left:0; right:0; top: 26%; height: 2px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
  pointer-events: none;
}
.forest-scene .sun {
  position: absolute; right: 18%; top: 8%;
  width: 48px; height: 48px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff8d8, #ffd66e 70%, #ffb347);
  box-shadow: 0 0 30px rgba(255,200,80,0.45);
  opacity: .85; pointer-events: none;
}
.forest-scene .hill {
  position: absolute; left:-5%; right:-5%; top: 22%;
  height: 60px; border-radius: 50%;
  background: linear-gradient(to bottom, #a8d3be, #88bfa6);
  opacity: .5; pointer-events: none;
}
.forest-scene .hill-2 {
  top: 25%; height: 80px;
  background: linear-gradient(to bottom, #98cdb6, #7cb59c);
  opacity: .35;
  left: 30%; right: -10%; width: 80%;
}
.forest-tree {
  position: absolute;
  pointer-events: none;
  filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.18));
  transform-origin: bottom center;
  animation: treeGrow .6s cubic-bezier(.34,1.56,.64,1) backwards;
}
@keyframes treeGrow {
  from { transform: scale(0) translateY(20px); opacity: 0; }
  to { transform: scale(var(--tree-scale, 1)) translateY(0); opacity: 1; }
}
.forest-shadow {
  position: absolute;
  width: 22px; height: 6px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.35), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.forest-scene .hint {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.92); font-size: .75rem; font-weight: 600;
  background: rgba(0,0,0,0.25); padding: .3rem .85rem; border-radius: 99px;
  letter-spacing: .5px; pointer-events: none;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
@media (prefers-color-scheme: dark) {
  .forest-scene {
    background:
      linear-gradient(to bottom,
        #2c3e35 0%,
        #3a4f44 22%,
        #4d6e5e 30%,
        #5d8473 50%,
        #6a9582 100%
      );
  }
  .forest-scene .hill { opacity: .25; }
  .forest-scene .hill-2 { opacity: .18; }
  .forest-scene .sun { opacity: .55; }
}

/* ===== Grid ===== */
.grid-2 { display:grid; grid-template-columns: repeat(2, 1fr); gap:.8rem; }
.grid-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:.8rem; }

.link-card .card-del {
  background: none;
  border: none;
  color: #ff453a;
  font-size: .78rem;
  cursor: pointer;
  padding: .15rem .4rem;
  opacity: .7;
}
.link-card .card-del:hover { opacity: 1; text-decoration: underline; }
.link-card.size-s { min-height: 95px; }
.link-card.size-m { min-height: 130px; }
.link-card.size-l { min-height: 170px; }
.link-card.size-s .card-title { font-size: 1rem; }
.link-card.size-l .card-title { font-size: 1.3rem; }
.link-card.size-l .card-url { font-size: .72rem; }

/* 内容收藏卡片：macOS 窗口风格（EmmaxPlay 设计） */
.link-card .tools {
  display: flex; align-items: center; gap: 0;
  margin: -.9rem -1rem 0;            /* 满宽出血，对齐 link-card 内边距 */
  padding: 10px 1rem 9px;
  border-bottom: 1px solid rgba(255,255,255,0.10);
}
.link-card .tools .circle { padding: 0 4px; line-height: 0; }
.link-card .tools .box {
  display: inline-block; width: 11px; height: 11px; border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.30);
}
.link-card .tools .red { background-color: #ff605c; }
.link-card .tools .yellow { background-color: #ffbd44; }
.link-card .tools .green { background-color: #00ca4e; }
.link-card .tools .win-title {
  flex: 1; text-align: center; font-size: .82rem; font-weight: 700;
  color: #fff; opacity: .85;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== Audio ===== */
.audio-box { width:100%; border-radius: var(--radius-sm); margin: .5rem 0; }
canvas { max-width:100%; border-radius: var(--radius-sm); background: #111; }

/* ===== Toast ===== */
#toast {
  position:fixed; bottom: 1.5rem; left:50%; transform: translateX(-50%) translateY(120px);
  background: var(--text); color: var(--bg); padding: .75rem 1.2rem; border-radius: 99px;
  z-index: 200; font-size: .85rem; font-weight: 500;
  opacity:0; transition: .3s; box-shadow: var(--shadow-dark);
}
#toast.show { transform: translateX(-50%) translateY(0); opacity:1; }

/* ===== Modal ===== */
#modalOverlay {
  display:none; position:fixed; inset:0; background: rgba(0,0,0,.45); z-index:150;
  align-items:center; justify-content:center; padding: 1rem;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#modalOverlay.show { display:flex; }
#modalBox {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-dark);
  max-width: 520px; width:100%; max-height: 90vh; overflow-y:auto; padding: 1.4rem;
}
#modalTitle { font-size: 1.1rem; font-weight: 700; margin-bottom: .9rem; letter-spacing: -.3px; }

/* ===== Module visibility ===== */
.module { display:none; animation: fade .25s; }
.module.active { display:block; }
@keyframes fade { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }

@media (min-width: 769px) { .mobile-only { display:none !important; } }
@media (max-width: 768px) { .desktop-only { display:none !important; } }

/* ===== Book item ===== */
.book-item { display:flex; gap:.85rem; align-items:flex-start; padding: .6rem 0; }
.book-item img {
  width: 60px; height: 86px; object-fit:cover; border-radius: 8px;
  background: var(--card-2); flex-shrink: 0;
}

/* ===== Stat grid ===== */
.stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:.6rem; }
.stat-box {
  background: var(--card-2); border-radius: var(--radius-sm);
  padding: .85rem .6rem; text-align:center;
}
.stat-box .num { font-size: 1.4rem; font-weight: 800; letter-spacing: -.5px; }
.stat-box .lbl { font-size: .72rem; color: var(--muted); margin-top:.2rem; font-weight: 500; }

/* ===== Collapsible ===== */
.collap-head { cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
.collap-body { overflow:hidden; transition: max-height .3s cubic-bezier(.4,0,.2,1); }

/* ===== Plan tree ===== */
.plan-node { margin-left: .6rem; border-left: 2px solid color-mix(in srgb, var(--text) 12%, transparent); padding-left: .8rem; }
.plan-node .node-title { font-weight: 600; margin: .4rem 0; }

/* ===== App launcher cards ===== */
.app-launch {
  display:flex; flex-direction:column; gap: .5rem;
  padding: 1.1rem 1.2rem;
  border-radius: var(--radius);
  cursor:pointer; transition: transform .12s, filter .12s;
}
.app-launch:active { transform: scale(.97); filter: brightness(.92); }
.app-launch .icon { font-size: 2rem; }
.app-launch .name { font-size: 1.05rem; font-weight: 700; letter-spacing: -.3px; }
.app-launch .sub { font-size: .78rem; opacity: .7; }

/* ===== Recurrence selector ===== */
.recurrence-tabs {
  display:flex; gap:.25rem; background: var(--card-2);
  border-radius: 10px; padding: .2rem;
}
.recurrence-tabs button {
  flex:1; min-height: 36px; border:none; background: transparent;
  color: var(--muted); font-weight: 600; font-size: .82rem;
  border-radius: 8px; cursor:pointer; transition: background .15s, color .15s;
}
.recurrence-tabs button.active {
  background: var(--card); color: var(--text);
  box-shadow: var(--shadow);
}
.weekday-picker { display:flex; gap:.3rem; flex-wrap:wrap; margin-top: .4rem; }
.weekday-picker button {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--text) 18%, transparent);
  background: transparent; color: var(--text); font-weight: 600;
  cursor:pointer; transition: background .15s, border-color .15s, color .15s;
  font-size: .82rem;
}
.weekday-picker button.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* ===== Plan group (English study) ===== */
.plan-group {
  background: var(--card-2); border-radius: var(--radius-sm);
  padding: .85rem 1rem; margin-bottom: .5rem;
}
.plan-group .pg-head {
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
}
.plan-group .pg-title { font-weight: 600; font-size: .95rem; }
.plan-group .pg-meta { font-size: .75rem; color: var(--muted); margin-top:.2rem; display:flex; gap:.4rem; flex-wrap:wrap; }
.plan-group .pg-body { padding-top: .6rem; margin-top: .6rem; border-top: 1px solid var(--border); display:none; }
.plan-group.open .pg-body { display:block; }
.plan-group .pg-task { display:flex; align-items:center; justify-content:space-between; font-size: .85rem; padding: .25rem 0; }

/* ===== iOS segment control ===== */
.segment {
  display:inline-flex; background: var(--card-2);
  border-radius: 10px; padding: .2rem; gap: .15rem;
}
.segment button {
  border:none; background:transparent; color: var(--muted);
  font-weight: 600; font-size: .82rem;
  padding: .35rem .75rem; border-radius: 8px;
  cursor:pointer; transition: background .15s, color .15s;
}
.segment button.active { background: var(--card); color: var(--text);   box-shadow: var(--shadow); }

/* ===== 模块卡片风格（Uiverse 适配，按模块作用域应用） ===== */
/* 注意：用 :not(.card-dark) 排除模块内的深底子卡，避免覆盖其专属配色导致文字看不清 */
/* 玻璃拟态：浮层氛围感 —— 天气、首页、每日计划、倒数日期 */
.mod-weather .wx-wrap,
.mod-weather .card:not(.card-dark),
.mod-home .card:not(.card-dark),
.mod-daily .card:not(.card-dark),
.mod-anniversary .card:not(.card-dark) {
  background: rgba(255,255,255,.14);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.28);
  box-shadow: var(--shadow-dark);
}
/* 轻玻璃：清晰薄磨砂 —— 列表 / 表单类模块 */
.mod-homework .card:not(.card-dark),
.mod-books .card:not(.card-dark),
.mod-bills .card:not(.card-dark),
.mod-collections .card:not(.card-dark),
.mod-moodDiary .card:not(.card-dark),
.mod-adventure .card:not(.card-dark) {
  background: rgba(248,249,250,.6);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(0,0,0,.08);
}
/* 渐变卡片：Galaxy 蓝绿高光 —— 饭香厨房、乐理 */
.mod-kitchen .card:not(.card-dark),
.mod-musicTheory .card:not(.card-dark) {
  background: linear-gradient(135deg, rgba(37,83,123,.20), rgba(128,195,234,.20));
  border: 1px solid rgba(37,83,123,.55);
  box-shadow: var(--shadow-dark);
}
/* 暗色卡片：沉浸专注 —— 番茄钟、习惯、漂流瓶 */
.mod-pomodoro .card:not(.card-dark),
.mod-habits .card:not(.card-dark),
.mod-bottle .card:not(.card-dark) {
  background: #2c3143;
  color: #f0f2f5;
  border-color: rgba(255,255,255,.06);
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.mod-pomodoro .muted,
.mod-habits .muted,
.mod-bottle .muted { color: rgba(255,255,255,.6); }

/* 暗色模式：半透明浅色风格卡片改为半透明深色背景，保证浅色文字清晰可读 */
@media (prefers-color-scheme: dark) {
  .mod-weather .wx-wrap, .mod-weather .card:not(.card-dark),
  .mod-home .card:not(.card-dark), .mod-daily .card:not(.card-dark), .mod-anniversary .card:not(.card-dark) {
    background: rgba(0,0,0,.34);
    border-color: rgba(255,255,255,.14);
  }
  .mod-homework .card:not(.card-dark), .mod-books .card:not(.card-dark), .mod-bills .card:not(.card-dark),
  .mod-collections .card:not(.card-dark), .mod-moodDiary .card:not(.card-dark), .mod-adventure .card:not(.card-dark) {
    background: rgba(0,0,0,.30);
    border-color: rgba(255,255,255,.10);
  }
  .mod-kitchen .card:not(.card-dark), .mod-musicTheory .card:not(.card-dark) {
    background: linear-gradient(135deg, rgba(37,83,123,.62), rgba(128,195,234,.52));
    border-color: rgba(128,195,234,.55);
  }
  .mod-pomodoro .card:not(.card-dark), .mod-habits .card:not(.card-dark), .mod-bottle .card:not(.card-dark) {
    background: #353c4f;
  }
}

/* 卡片悬停动画（与首页天气卡片一致）：上移 + 浮起阴影。
   用 [class*="mod-"] 提升特异性，确保 hover 阴影能盖过各模块风格设置的 box-shadow */
[class*="mod-"] .card:not(.card-dark):hover,
[class*="mod-"] .wx-wrap:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(37,83,123,0.15);
}
[class*="mod-"] .card:not(.card-dark):active { transform: scale(.99); }

/* 桌面端适配：内容区随屏增大、尽量铺满，网格卡片随之拉伸 */
@media (min-width: 900px)  { #main { max-width: 860px; } }
@media (min-width: 1100px) { #main { max-width: 1040px; } }
@media (min-width: 1300px) { #main { max-width: 1240px; } }
@media (min-width: 1600px) { #main { max-width: 1480px; } }

<body>
<div id="overlay"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">GZ</div>
      <div>
        <h1>Genzy</h1>
        <small>工作台</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">数据仅存本地 · 刷新不丢</div>
  </aside>
  <main id="main">
    <div id="topbar">
      <div class="pixel page-title">Genzy</div>
      <button id="menuBtn" aria-label="菜单"><div class="bar"></div><div class="bar"></div><div class="bar"></div></button>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>
<div id="modalOverlay"><div id="modalBox"><div id="modalTitle"></div><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const ICON_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="%23111"/><rect x="64" y="64" width="384" height="384" fill="%23fff" rx="40"/><rect x="120" y="120" width="80" height="80" fill="%23111"/><rect x="312" y="120" width="80" height="80" fill="%23111"/><rect x="120" y="216" width="272" height="40" fill="%23111"/><rect x="120" y="288" width="200" height="40" fill="%23111"/><rect x="120" y="360" width="272" height="40" fill="%23111"/></svg>`;

// ===== PWA =====
(function(){
  const manifest = {
    name: 'Genzy 工作台', short_name: 'Genzy',
    start_url: '.', display: 'standalone',
    background_color: '#f4f4f0', theme_color: '#111111',
    icons: [{ src: ICON_SVG, sizes: '512x512', type: 'image/svg+xml' }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
  document.getElementById('appIconLink').href = ICON_SVG;
  const swCode = `self.addEventListener('install', e=>{ self.skipWaiting(); e.waitUntil(caches.open('genzy-v1').then(c=>c.add(self.registration.scope))); }); self.addEventListener('activate', e=>e.waitUntil(clients.claim())); self.addEventListener('fetch', e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(self.registration.scope)))); });`;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
})();

// ===== Storage =====
const STORE_PREFIX = 'genzy_';
const Storage = {
  get(key, def){
    try { const v = localStorage.getItem(STORE_PREFIX+key); return v===null ? def : JSON.parse(v); }
    catch(e){ return def; }
  },
  set(key, val){ try { localStorage.setItem(STORE_PREFIX+key, JSON.stringify(val)); } catch(e){ toast('存储空间不足，请导出备份'); } },
  remove(key){ try { localStorage.removeItem(STORE_PREFIX+key); } catch(e){} },
  exportAll(){
    const out = {};
    for (let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); if (k && k.startsWith(STORE_PREFIX)) out[k]=localStorage.getItem(k);
    }
    return 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(out,null,2));
  },
  importAll(text){
    try {
      const data = JSON.parse(text);
      for (const k in data) { if (k.startsWith(STORE_PREFIX)) localStorage.setItem(k, data[k]); }
      return true;
    } catch(e){ return false; }
  }
};

// ===== State =====
const todayStr = () => new Date().toLocaleDateString('en-CA', {timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone, year:'numeric', month:'2-digit', day:'2-digit'});
const uid = () => Math.random().toString(36).slice(2,10);
const fmtDate = (d) => new Date(d).toLocaleDateString('zh-CN', {month:'short', day:'numeric', weekday:'short'});
const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TRASH_SVG = '<svg viewBox="0 0 16 16" fill="none"><path class="bin-top" d="M2 4.5h12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M4.5 4.5l1 9.5h5l1-9.5" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.5 2h3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M5.5 7.5v5M8 7.5v5M10.5 7.5v5" stroke="#fff" stroke-width="1" stroke-linecap="round"/></svg>';

const REC_LABELS = {daily:'每天', weekdays:'工作日', custom:'自定义'};
const WD_SHORT = ['日','一','二','三','四','五','六'];

let state = {};
function loadState(){
  state = {
    settings: Storage.get('settings', {lastModule:'home'}),
    forest: Storage.get('forest', {total:0, trees:[]}),
    daily: Storage.get('daily', {tasks:{}, currentDate: todayStr()}),
    english: Storage.get('english', {lessons:[], currentLessonId:null, currentStep:0, currentSentence:0, difficult:[], tasks:[]}),
    collections: Storage.get('collections', {groups:['默认'], links:[]}),
    bills: Storage.get('bills', {expenses:{}, savings:0, savingsHistory:[]}),
    homework: Storage.get('homework', {images:[], tasks:[]}),
    books: Storage.get('books', {tasks:[], timer:{}, prefs:{genres:[], moods:[], langs:[]}}),
    kitchen: Storage.get('kitchen', {}),
    diary: Storage.get('diary', {entries:{}, bottles:[], moods:null})
  ,weather: Storage.get('weather', {city:'北京',data:null}),
    habits: Storage.get('habits', {items:[]}),
    adventure: Storage.get('adventure', {steps:0, unlocked:[]}),
    timers: Storage.get('timers', {events:[], stopwatch:{running:false,startTime:null,elapsed:0}, countdown:{target:null,running:false}})
  };
  if (!state.daily.tasks) state.daily.tasks = {};
  if (!state.daily.currentDate) state.daily.currentDate = todayStr();
}
let saveTimer;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    Storage.set('settings', state.settings);
    Storage.set('forest', state.forest);
    Storage.set('daily', state.daily);
    Storage.set('english', state.english);
    Storage.set('collections', state.collections);
    Storage.set('bills', state.bills);
    Storage.set('homework', state.homework);
    Storage.set('books', state.books);
    Storage.set('kitchen', state.kitchen);
    Storage.set('diary', state.diary);
    Storage.set('weather', state.weather);
    Storage.set('timers', state.timers);
    Storage.set('habits', state.habits);
    Storage.set('adventure', state.adventure);
  }, 200);
}

// ===== UI helpers =====
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
function modal(title, html){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html; $('#modalOverlay').classList.add('show'); }
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
$('#modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

const MODULES = [
  {cat:'核心要点', icon:'🎯', items:[
    {id:'home', label:'首页', icon:'🏠'},
    {id:'daily', label:'每日计划', icon:'🌲'},
    {id:'weather', label:'每日天气', icon:'🌤️'},
    {id:'pomodoro', label:'番茄时钟', icon:'🍅'},
    {id:'anniversary', label:'倒数日期', icon:'📌'},
    {id:'habits', label:'习惯养成', icon:'✅'},
    {id:'adventure', label:'像素冒险', icon:'🧭'}
  ]},
  {cat:'学习提升', icon:'📈', items:[
    {id:'english', label:'外语学习', icon:'🔁'},
    {id:'homework', label:'作业完成', icon:'📝'},
    {id:'books', label:'书香书屋', icon:'📚'},
    {id:'musicTheory', label:'乐理学习', icon:'🎵'}
  ]},
  {cat:'生活记录', icon:'📖', items:[
    {id:'moodDiary', label:'心情日记', icon:'😊'},
    {id:'bottle', label:'漂流瓶里', icon:'🗾'}
  ]},
  {cat:'其他', icon:'📌', items:[
    {id:'collections', label:'内容收藏', icon:'⭐'},
    {id:'bills', label:'消费记账', icon:'💰'},
    {id:'kitchen', label:'饭香厨房', icon:'🍳'}
  ]}
];

const COLLAPSED_KEYS = 'genzy_collapsed';
function getCollapsed(){
  try{return JSON.parse(localStorage.getItem(COLLAPSED_KEYS)||'{}');}catch(e){return{};}
}
function setCollapsed(cat, v){
  var o=getCollapsed(); o[cat]=v;
  try{localStorage.setItem(COLLAPSED_KEYS,JSON.stringify(o));}catch(e){}
}

function initNav(){
  const nav = $('#nav');
  var collapsed = getCollapsed();
  nav.innerHTML = MODULES.map(function(g){
    var isCollapsed = collapsed[g.cat]===true;
    return '<div class="nav-cat" data-cat="'+g.cat+'"><span><span class="icon">'+(g.icon||'')+'</span> '+g.cat+'</span><span class="arrow'+(isCollapsed?' collapsed':'')+'">▼</span></div>'+
      '<div class="nav-items'+(isCollapsed?' collapsed':'')+'" data-cat="'+g.cat+'">'+
      g.items.map(function(m){return '<div class="nav-item" data-mod="'+m.id+'"><span class="icon">'+m.icon+'</span><span class="label">'+m.label+'</span></div>';}).join('')+
      '</div>';
  }).join('');
  // 分类头点击切换折叠
  $$('.nav-cat', nav).forEach(function(el){
    el.addEventListener('click', function(){
      var cat=el.dataset.cat, items=document.querySelector('.nav-items[data-cat="'+cat+'"]'), arrow=el.querySelector('.arrow');
      if(!items)return;
      var nowCollapsed=items.classList.toggle('collapsed');
      if(arrow)arrow.classList.toggle('collapsed', nowCollapsed);
      setCollapsed(cat, nowCollapsed);
    });
  });
  $$('.nav-item', nav).forEach(function(el){ el.addEventListener('click', function(){ switchModule(el.dataset.mod); }); });
  $('#menuBtn').addEventListener('click', openSidebar);
  $('#overlay').addEventListener('click', closeSidebar);
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); $('#menuBtn').classList.add('open'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); $('#menuBtn').classList.remove('open'); }

let currentModule = 'daily';
function switchModule(id){
  currentModule = id; state.settings.lastModule = id; saveState();
  $$('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.mod===id));
  renderContent();
  closeSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ===== Daily tasks helpers =====
function getDailyTasks(date){
  if (!state.daily.tasks[date]) state.daily.tasks[date] = [];
  return state.daily.tasks[date];
}
function addDailyTask(date, text, source='daily', time=''){
  const list = getDailyTasks(date);
  const t = {id:uid(), text, done:false, source, time, created: Date.now()};
  list.unshift(t); saveState(); return t;
}
function removeDailyTask(date, id){
  const list = getDailyTasks(date);
  const t = list.find(x=>x.id===id);
  if (t && t.done) removeTree();
  state.daily.tasks[date] = list.filter(x=>x.id!==id);
  saveState();
}
function toggleDailyTask(date, id){
  const t = getDailyTasks(date).find(x=>x.id===id);
  if (!t) return;
  const wasDone = t.done;
  t.done = !t.done;
  if (t.done && !wasDone) { plantTree(); adventureStep(); }      // 完成 → 种树 + 冒险前进一步
  else if (!t.done && wasDone) { removeTree(); adventureUnstep(); } // 取消完成 → 撤回种植 + 后退一步
  saveState();
}
function plantTree(){
  state.forest.total++;
  state.forest.trees.push({id:uid(), date:todayStr()});
  saveState();
}
function removeTree(){
  if (state.forest.total > 0) state.forest.total--;
  if (state.forest.trees.length) state.forest.trees.pop();
  saveState();
}

// ===== Forest Scene (3D low-poly trees on grass) =====
function renderForestScene(trees){
  if (!trees || !trees.length) {
    return `
    <div class="forest-scene">
      <div class="sun"></div>
      <div class="hill hill-2"></div>
      <div class="hill"></div>
      <div class="horizon"></div>
      <div class="hint" style="top:50%;transform:translate(-50%,-50%);font-size:.95rem;background:rgba(0,0,0,0.32);padding:.6rem 1.2rem">🌱 完成第一个任务，种下你的第一棵树</div>
    </div>`;
  }
  // Limit visible trees for performance; keep most recent
  const visible = trees.slice(-80);
  // Deterministic pseudo-random based on tree id
  const hash = (s) => {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h;
  };
  const rand = (h, salt) => {
    // Mix in a salt, return [0, 1)
    let x = (h ^ (salt * 0x9E3779B1)) >>> 0;
    x = Math.imul(x ^ (x >>> 16), 0x85ebca6b) >>> 0;
    x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  };
  // Assign each tree to a depth row (0=back ... 4=front), spread evenly
  const depthCount = 5;
  const buckets = Array.from({length: depthCount}, () => []);
  visible.forEach((t, i) => {
    const h = hash(t.id || String(i));
    const d = i % depthCount; // distribute by index for even row distribution
    buckets[d].push({t, h, i});
  });
  // For each depth bucket, place trees left-to-right with even spacing + jitter
  const placed = [];
  buckets.forEach((bucket, depth) => {
    const n = bucket.length || 1;
    const yBase = [42, 56, 70, 82, 92][depth];
    const scaleBase = [0.5, 0.65, 0.8, 0.95, 1.15][depth];
    const spreadW = [0.92, 0.88, 0.84, 0.78, 0.72][depth];
    const leftPad = (1 - spreadW) / 2 * 100;
    bucket.forEach(({h, i}, idx) => {
      const slot = (idx + 0.5) / n; // 0..1 even slot
      const jitter = (rand(h, 7) - 0.5) * (1 / n) * 0.7;
      const x = leftPad + (slot + jitter) * spreadW * 100;
      const yJ = (rand(h, 13) - 0.5) * 4;
      const scaleJ = 0.85 + rand(h, 21) * 0.3;
      const hue = Math.round((rand(h, 33) - 0.5) * 24);
      placed.push({
        x: Math.max(2, Math.min(98, x)),
        y: yBase + yJ,
        scale: scaleBase * scaleJ,
        hue,
        depth,
        animDelay: i * 15
      });
    });
  });
  // Render back-to-front
  placed.sort((a, b) => a.depth - b.depth);
  const sky = `
    <div class="sun"></div>
    <div class="hill hill-2"></div>
    <div class="hill"></div>
    <div class="horizon"></div>
  `;
  const treeEls = placed.map(p => renderTree3D(p)).join('');
  return `<div class="forest-scene">${sky}${treeEls}<div class="hint">${trees.length} 棵树 · 滚动查看</div></div>`;
}
function renderTree3D(p){
  // Low-poly pine tree with 3 stacked triangular tiers, 3D faces (left=dark, right=light)
  const w = 70, h = 90;
  // Hue filter via CSS color-mix on fills (use SVG inline)
  const tiers = [
    // [top-y, width-half]
    {y: 6, hw: 14, light:'#7fc66b', dark:'#5ba148', front:'#6cb55a'},
    {y: 26, hw: 20, light:'#6db95d', dark:'#4d8d3d', front:'#5ea64e'},
    {y: 48, hw: 27, light:'#5aa64b', dark:'#3d7a2d', front:'#4a8a3d'},
  ];
  const tierSvg = tiers.map(t => {
    const top = t.y, bottom = top + 22, mid = top + 11;
    return `
      <polygon points="${w/2},${top} ${w/2 - t.hw},${bottom} ${w/2},${bottom}" fill="${t.dark}"/>
      <polygon points="${w/2},${top} ${w/2},${bottom} ${w/2 + t.hw},${bottom}" fill="${t.light}"/>
    `;
  }).join('');
  const trunk = `<rect x="${w/2 - 4}" y="68" width="8" height="14" fill="#6b4423"/><rect x="${w/2 - 4}" y="68" width="3" height="14" fill="#4f2f17"/>`;
  const shadow = `<ellipse cx="${w/2}" cy="${h - 3}" rx="20" ry="3.5" fill="rgba(0,0,0,0.32)"/>`;
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible">${shadow}${tierSvg}${trunk}</svg>`;
  const filter = p.hue ? `hue-rotate(${p.hue}deg)` : 'none';
  const animDelay = p.animDelay ? `${Math.min(p.animDelay, 600)}ms` : '0ms';
  return `<div class="forest-tree" style="left:${p.x.toFixed(1)}%;top:${p.y.toFixed(1)}%;--tree-scale:${p.scale.toFixed(2)};filter:${filter};animation-delay:${animDelay}">${svg}</div>`;
}
function sourceLabel(src){
  for(var g=0;g<MODULES.length;g++){var m=MODULES[g].items.find(function(x){return x.id===src;}); if(m) return m.label;}
  return src;
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openApp(scheme, fallback){
  // 1) 先尝试用 URL Scheme 直接打开原生 App
  window.location.href = scheme;
  // 2) 若 1 秒后页面仍可见（说明 App 未安装/未接管），则兜底打开官网。
  //    优先新标签页（保留工作台），被拦截时退回同标签跳转，避免弹窗拦截导致“无任何反应”。
  setTimeout(() => {

      let w = null;
      try { w = window.open(fallback, '_blank', 'noopener'); } catch (e) { w = null; }
      if (!w) window.location.href = fallback;
    }
  }, 1000);
}

function flipClockHTML(idSuffix=''){
  const mk = (val, small) => `<div class="flip-digit${small?' flip-digit-small':''}" data-value="${val}">` +
    `<div class="flip-half flip-top"><span class="digit-text">${val}</span></div>` +
    `<div class="flip-half flip-bottom"><span class="digit-text">${val}</span></div>` +
    `<div class="flip-flap"><span class="digit-text">${val}</span></div>` +
    `</div>`;
  return `<div class="flip-clock" id="flipClock${idSuffix}">` +
    `<div class="flip-clock-main">` +
      `<div class="flip-pair" id="fgH${idSuffix}">${mk(0)}${mk(0)}</div>` +
      `<div class="flip-pair" id="fgM${idSuffix}">${mk(0)}${mk(0)}</div>` +
    `</div>` +
    `<div class="flip-clock-seconds">` +
      `<div class="flip-pair" id="fgS${idSuffix}">${mk(0,true)}${mk(0,true)}</div>` +
    `</div>` +
  `</div>`;
}
function flipUpdateDigit(digitEl, newValue){
  const oldValue = digitEl.dataset.value || '';
  const newStr = String(newValue);
  if (oldValue === newStr) return;
  const top = digitEl.querySelector('.flip-top .digit-text');
  const bottom = digitEl.querySelector('.flip-bottom .digit-text');
  const flapEl = digitEl.querySelector('.flip-flap');
  const flap = flapEl ? flapEl.querySelector('.digit-text') : null;
  if (!oldValue) {
    top.textContent = newStr; bottom.textContent = newStr;
    if (flap) flap.textContent = newStr;
    digitEl.dataset.value = newStr;
    return;
  }
  if (flap) flap.textContent = oldValue;
  top.textContent = newStr;
  bottom.textContent = newStr;
  if (flapEl) {
    flapEl.classList.remove('flipping');
    void flapEl.offsetWidth;
    flapEl.classList.add('flipping');
  }
  digitEl.dataset.value = newStr;
}
function flipUpdateGroup(groupId, d1, d2){
  const digits = document.querySelectorAll('#' + groupId + ' .flip-digit');
  if (digits.length >= 2) {
    flipUpdateDigit(digits[0], d1);
    flipUpdateDigit(digits[1], d2);
  }
}
function setFlipClock(idSuffix, totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60), s = totalSeconds%60;
  flipUpdateGroup('fgH' + idSuffix, Math.floor(h/10), h%10);
  flipUpdateGroup('fgM' + idSuffix, Math.floor(m/10), m%10);
  flipUpdateGroup('fgS' + idSuffix, Math.floor(s/10), s%10);
}
const TIMER_INTERVALS = {};
function startTick(key, updater){
  stopTick(key);
  updater();
  TIMER_INTERVALS[key] = setInterval(updater, 250);
}
function stopTick(key){
  if (TIMER_INTERVALS[key]) { clearInterval(TIMER_INTERVALS[key]); delete TIMER_INTERVALS[key]; }
}

function renderLinkCards(links, prefix){
  if (!links.length) return '<div class="empty">暂无收藏链接</div>';
  const groups = {};
  links.forEach(l=>{ groups[l.group||'默认'] = groups[l.group||'默认']||[]; groups[l.group||'默认'].push(l); });
  const sizeHash = s => { let h=0; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); };
  const sizes = ['s','m','l'];
  return Object.keys(groups).map(g=>{
    const grp = groups[g];
    return '<div style="margin:.6rem 0"><div class="pill">' + escapeHtml(g) + '</div>' +
    '<div class="links-masonry" style="margin-top:.4rem">' +
      grp.map(l=>{
        const sz = sizes[sizeHash(l.name + l.url) % 3];
        return '<div class="link-card size-' + sz + '" data-url="' + escapeHtml(l.url) + '" onclick="window.open(this.dataset.url,\'_blank\',\'noopener\');">' +
          '<div class="tools">' +
            '<span class="circle"><span class="box red"></span></span>' +
            '<span class="circle"><span class="box yellow"></span></span>' +
            '<span class="circle"><span class="box green"></span></span>' +
            '<span class="win-title">' + escapeHtml(l.name) + '</span>' +
          '</div>' +
          '<div class="card-tag"><span class="dot"></span><span>' + escapeHtml(g) + '</span></div>' +
          '<div class="card-url">' + escapeHtml(l.url) + '</div>' +
          '<div class="card-meta">' +
            '<span class="card-badge"><span class="n-icon">N</span>新卡</span>' +
            '<button class="card-del ' + prefix + 'DelLink" data-id="' + l.id + '" onclick="event.stopPropagation();">删除</button>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div></div>';
  }).join('');
}
function bindLinkCardActions(prefix){
  const storeKey = 'collections';
  $$(`.${prefix}DelLink`).forEach(b=> b.addEventListener('click', ()=>{
    state[storeKey].links = state[storeKey].links.filter(l=>l.id!==b.dataset.id); saveState(); renderContent();

}
function renderTaskTable(tasks, prefix){

function renderTimerUI(idSuffix){
  return `<div>${flipClockHTML(idSuffix)}</div>
  <div class="form-row" style="justify-content:center;flex-wrap:wrap">
    <input type="number" class="input" id="tMin${idSuffix}" placeholder="分" style="width:80px">
    <input type="number" class="input" id="tSec${idSuffix}" placeholder="秒" style="width:80px">
    <button class="btn" id="tStartC${idSuffix}">倒计时</button>
    <button class="btn secondary" id="tStartS${idSuffix}">正计时</button>
    <button class="btn danger" id="tStop${idSuffix}">停止</button>
    <button class="btn btn-sm secondary" id="tReset${idSuffix}">重置</button>
  </div>`;
}
function initTimer(idSuffix, onDone){
  let mode=''; // countup or countdown
  let remaining=0, elapsed=0, last=0;
  const update = ()=>{
    const now = Date.now();
    const delta = (now - last)/1000; last = now;
    if (mode==='countdown') { remaining -= delta; if (remaining<=0){ remaining=0; stopTick('timer'+idSuffix); if(onDone) onDone(); toast('计时结束'); } setFlipClock(idSuffix, remaining); }
    else if (mode==='countup') { elapsed += delta; setFlipClock(idSuffix, elapsed); }
  };
  const startCountdown = ()=>{
    const m=parseInt($('#tMin'+idSuffix).value||0), s=parseInt($('#tSec'+idSuffix).value||0);
    remaining = m*60+s; if(remaining<=0) return; mode='countdown'; last=Date.now(); startTick('timer'+idSuffix, update);
  };
  const startCountup = ()=>{ elapsed=0; mode='countup'; last=Date.now(); startTick('timer'+idSuffix, update); };
  $('#tStartC'+idSuffix).addEventListener('click', startCountdown);
  $('#tStartS'+idSuffix).addEventListener('click', startCountup);
  $('#tStop'+idSuffix).addEventListener('click', ()=> stopTick('timer'+idSuffix));
  $('#tReset'+idSuffix).addEventListener('click', ()=>{ stopTick('timer'+idSuffix); setFlipClock(idSuffix, 0); mode=''; });
  setFlipClock(idSuffix, 0);
}

initModule.homework = function(){
  // Reset photo state on every module entry
  state.homework.images = [];
  $('#hwPreviewBox').innerHTML = '';
  $('#hwOcrBox').style.display = 'none';
  $('#hwOcrText').value = '';
  const fileInput = $('#hwFile'); if (fileInput) fileInput.value = '';
  $('#hwStatus').textContent = '';

  let currentThumb = '';
  $('#hwUpload').addEventListener('click', async ()=>{
    const f = $('#hwFile').files[0];
    if (!f) { toast('请先选择图片'); return; }
    // Reset any previous preview / OCR state
    currentThumb = '';
    $('#hwPreviewBox').innerHTML = '';
    $('#hwOcrBox').style.display = 'none';
    $('#hwOcrText').value = '';

    $('#hwStatus').textContent = '🔄 正在压缩预览...';
    try {
      currentThumb = await makeThumb(f);
      $('#hwPreviewBox').innerHTML = `<img src="${currentThumb}" style="max-width:100%;max-height:260px;border-radius:14px">`;
    } catch(e) { /* ignore thumb error */ }

    $('#hwStatus').textContent = '🤖 正在进行 OCR 识别，请稍候...';
    try {
      const worker = await Tesseract.createWorker('chi_sim+eng');
      const ret = await worker.recognize(f);
      await worker.terminate();
      $('#hwOcrText').value = ret.data.text;
      $('#hwOcrBox').style.display = 'block';
      $('#hwStatus').textContent = '✅ 识别完成，请检查后生成任务';

      $('#hwStatus').textContent = '❌ 识别失败：' + e.message;

  });

  $('#hwAddTasks').addEventListener('click', ()=>{

    saveState();

    removeDailyTask(b.dataset.date, b.dataset.id);

  }));
};
function makeThumb(file, max=600){
  return new Promise((res)=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas');
      const scale = Math.min(max/img.width, max/img.height, 1);
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      res(canvas.toDataURL('image/jpeg',.7));
    };
    img.src=URL.createObjectURL(file);
  });
}

// 从 excerpt 中提取纯文本摘要
function extractSummary(excerpt){
  if(!excerpt) return '';
  var text = excerpt.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  // 去掉开头的"内容简介"等字样
  text = text.replace(/^内容简介\s*[·•]?\s*/, '');
  return text;
}

// 从 content 中提取作者信息
function extractAuthor(content){
  if(!content) return '';
  var m = content.match(/作者简介[\s\S]*?<p[^>]*>([^<]+)</);
  if(m && m[1]){
    var name = m[1].replace(/，.*/, '').trim();
    if(name.length < 20) return name;
  }
  return '';
}

// 搜索图书
async function fetchSobooksSearch(q, page){
  try {
    var url = SOBooks_BASE + '/posts?search=' + encodeURIComponent(q) +
              '&per_page=15&page=' + (page||1) +
              '&_fields=id,title,excerpt,link,categories,tags,featured_media';
    var res = await fetch(url);
    if(!res.ok) throw new Error('fail');
    var data = await res.json();
    return (data||[]).map(function(p){
      return {
        id: 'sb-' + p.id,
        title: p.title ? p.title.rendered : '',
        summary: extractSummary(p.excerpt ? p.excerpt.rendered : ''),
        link: p.link,
        categories: (p.categories||[]).map(function(c){ return SOBooks_CATS[c] || ''; }).filter(Boolean),
        cover: null,
        external: true,
        sobooks: true
      };
    });
  } catch(e){ return []; }
}

function dayOfYear(){
  var now = new Date(); var start = new Date(now.getFullYear(),0,0);
  return Math.floor((now - start)/86400000);
}
function bookCategoriesFromPrefs(){
  var prefs = state.books.prefs || {genres:[], moods:[], langs:[]};
  var cats = [];
  (prefs.genres||[]).forEach(function(g){
    var x = BOOK_GENRES.find(function(y){ return y.label===g; });
    if(x && cats.indexOf(x.cat)<0) cats.push(x.cat);
  });
  (prefs.moods||[]).forEach(function(m){
    var x = BOOK_MOODS.find(function(y){ return y.label===m; });
    if(x) x.boost.forEach(function(c){ if(cats.indexOf(c)<0) cats.push(c); });
  });
  if(cats.length===0) cats = [7, 5, 2, 9]; // 默认：小说文学、历史传记、人文社科、经济管理
  return cats;
}
async function loadDailyRecs(){
  var prefs = state.books.prefs || {genres:[], moods:[], langs:[]};
  var cats = bookCategoriesFromPrefs();
  var daySeed = dayOfYear();
  var collected = [];
  // Pick up to 3 categories, vary page by day for daily freshness
  var picks = cats.slice(0, 3);
  for(var i=0;i<picks.length;i++){
    var books = await fetchSobooksByCategory(picks[i], (daySeed + i*2) % 10 + 1);
    if(books && books.length){
      collected = collected.concat(books.slice(0,5));
    }
  }
  var seen = {}; collected = collected.filter(function(b){ if(seen[b.id]) return false; seen[b.id]=1; return true; });
  var cont = document.getElementById('bookRecs');
  if(cont){
    if(collected.length){
      cont.innerHTML = collected.slice(0,10).map(renderBookCard).join('');
    } else {
      cont.innerHTML = '<div class="empty">暂时没有匹配的推荐，换个类型试试～</div>';
    }
  }
}
async function runBookSearch(q){
  var cont = document.getElementById('bookSearchResults');
  if(!cont) return;
  if(!q){ cont.innerHTML = ''; return; }
  cont.innerHTML = '<div class="empty">搜索中…</div>';
  var results = await fetchSobooksSearch(q, 1);
  if(results.length){
    cont.innerHTML = results.slice(0,15).map(renderBookCard).join('');
  } else {
    cont.innerHTML = '<div class="empty">没有找到相关图书，换个关键词试试</div>';
  }
}

      state.books.tasks=state.books.tasks.filter(function(x){ return x.id!==b.dataset.id; }); saveState(); renderContent();
    });
  });
  initTimer('book');

  function syncChips(){
    var p = state.books.prefs || {genres:[], moods:[], langs:[]};
    document.querySelectorAll('#bookGenreChips .book-chip').forEach(function(c){
      c.classList.toggle('active', (p.genres||[]).indexOf(c.dataset.g) >= 0);
    });
    document.querySelectorAll('#bookMoodChips .book-chip').forEach(function(c){
      c.classList.toggle('active', (p.moods||[]).indexOf(c.dataset.m) >= 0);
    });
    document.querySelectorAll('#bookLangChips .book-chip').forEach(function(c){
      c.classList.toggle('active', (p.langs||[]).indexOf(c.dataset.l) >= 0);
    });
  }
  function toggleIn(arr, val){ var i = arr.indexOf(val); if(i>=0) arr.splice(i,1); else arr.push(val); }
  // 确保 prefs 结构存在（兼容旧数据）
  if(!state.books.prefs || typeof state.books.prefs !== 'object') state.books.prefs = {};
  if(!Array.isArray(state.books.prefs.genres)) state.books.prefs.genres = [];
  if(!Array.isArray(state.books.prefs.moods)) state.books.prefs.moods = [];
  if(!Array.isArray(state.books.prefs.langs)) state.books.prefs.langs = [];
  // 事件委托，避免逐个绑定遗漏
  document.querySelectorAll('#bookGenreChips .book-chip, #bookMoodChips .book-chip, #bookLangChips .book-chip').forEach(function(c){
    c.addEventListener('click', function(){
      if(c.dataset.g) toggleIn(state.books.prefs.genres, c.dataset.g);

      else if(c.dataset.l) toggleIn(state.books.prefs.langs, c.dataset.l);

function renderMiniCalendar(){
  var today = todayStr();
  var entries = state.diary.entries||{};
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth()+1;
  // 仅从周一开始显示本周及前后各一周，共 3 周
  var firstDay = new Date(y, m-1, 1);
  var lastDate = new Date(y, m, 0).getDate();
  var startW = firstDay.getDay();
  var cells = [];
  var dows = ['日','一','二','三','四','五','六'];
  dows.forEach(function(d){ cells.push('<div class="mc-dow">'+d+'</div>'); });
  for(var i=0;i<startW;i++) cells.push('<div></div>');
  for(var d=1;d<=lastDate;d++){
    var ds = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday = ds===today ? ' mc-today' : '';
    var entriesVal = (state.diary.entries||{})[ds];
    var moodHtml = entriesVal ? '<span class="mc-mood">'+entriesVal.mood+'</span>' : '';
    cells.push('<div class="mc-day'+isToday+'">'+d+moodHtml+'</div>');
  }
  return '<div class="mini-cal">'+cells.join('')+'</div>';
}

initModule.pomodoro = function(){

    var now = Date.now(); var d = (now-last)/1000; last = now;
    if(mode==='countdown'){ remaining -= d; if(remaining<=0){ remaining=0; stopTick('timerPomo'); toast('⏰ 计时结束'); } setFlipClock('pomo', remaining); }
    else if(mode==='countup'){ elapsed += d; setFlipClock('pomo', elapsed); }
  };
  $('#pStartC').addEventListener('click', function(){
    var m = parseInt($('#pMin').value||0), s = parseInt($('#pSec').value||0);
    remaining = m*60+s; if(remaining<=0) return; mode='countdown'; last=Date.now(); startTick('timerPomo', update);
  });
  $('#pStartS').addEventListener('click', function(){ elapsed=0; mode='countup'; last=Date.now(); startTick('timerPomo', update); });
  $('#pStop').addEventListener('click', function(){ stopTick('timerPomo'); });
  $('#pReset').addEventListener('click', function(){ stopTick('timerPomo'); setFlipClock('pomo',0); mode=''; });
  setFlipClock('pomo', 0);
};

async function fetchWeather(lat, lon){
  try {
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, 8000);
    var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,apparent_temperature&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset,sunrise,uv_index_max&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=7';
    var r=await fetch(url,{signal:ctrl.signal}); clearTimeout(t);
    if(!r.ok) throw Error('fail');
    return await r.json();
  } catch(e){ return null; }
}

var _weatherLoaded = false;
function loadWeather(force){
  if(_weatherLoaded && !force) return;
  var cached = state.weather;
  var hasCache = cached && cached.data && cached.data.current;
  var cacheAge = hasCache ? (Date.now() - (cached.lastUpdate||0)) : Infinity;
  var CACHE_TTL = 10 * 60 * 1000;
  if(hasCache && cacheAge < CACHE_TTL && !force) return;

  function doFetch(lat, lon, city){
    var cityName = city || '当前定位';
    Promise.all([fetchWeather(lat, lon), fetchAirQuality(lat, lon)]).then(function(results){
      var data = results[0], aqiData = results[1];
      if(data){
        state.weather.data = data;
        state.weather.aqi = aqiData || state.weather.aqi || {};
        state.weather.city = cityName;
        state.weather.loading = false;
        state.weather.error = false;
        state.weather.lastUpdate = Date.now();
        if(typeof saveState === 'function') saveState();
      } else {
        state.weather.error = true;
        state.weather.loading = false;
      }
      _weatherLoaded = false;
      if(typeof renderContent === 'function') renderContent();
    });
  }

  // 有旧缓存则先展示，后台刷新
  if(hasCache && cacheAge >= CACHE_TTL && !force){
    _weatherLoaded = true;
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(p){ doFetch(p.coords.latitude, p.coords.longitude, getCityFromCoords(p.coords.latitude, p.coords.longitude)); },
        function(){ doFetch(39.9, 116.4, '北京'); }
      );
    } else { doFetch(39.9, 116.4, '北京'); }
    return;
  }

  // 无缓存
  _weatherLoaded = true;
  state.weather = state.weather || {};
  state.weather.loading = true;
  if(typeof renderContent === 'function') renderContent();
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){ doFetch(p.coords.latitude, p.coords.longitude, getCityFromCoords(p.coords.latitude, p.coords.longitude)); },
      function(){ doFetch(39.9, 116.4, '北京'); }
    );
  } else { doFetch(39.9, 116.4, '北京'); }
}
function getCityFromCoords(lat, lon){
  if(lat>30&&lat<35&&lon>118&&lon<123) return '上海附近';
  if(lat>22&&lat<24&&lon>113&&lon<115) return '广州附近';
  if(lat>39&&lat<41&&lon>115&&lon<118) return '北京附近';
  return '当前定位';
}

function checkHabits(){
  var items = state.habits && state.habits.items || [];
  if(!items.length) return;
  var today = todayStr();
  var now = new Date();
  var currentMinutes = now.getHours() * 60 + now.getMinutes();
  var dow = now.getDay(); // 0=Sun
  var changed = false;
  items.forEach(function(h){
    if(!h.enabled) return;
    // 检查重复规则
    var rec = h.recurrence || 'daily';
    if(rec === 'weekdays' && (dow===0||dow===6)) return;
    if(rec === 'custom' && (!h.weekdays||!h.weekdays.includes(dow))) return;
    // 检查时间段
    var st = (h.startTime || '00:00').split(':').map(Number);
    var et = (h.endTime || '23:59').split(':').map(Number);
    var startM = st[0]*60 + st[1];
    var endM = et[0]*60 + et[1];
    if(currentMinutes < startM || currentMinutes > endM) return;
    var intervalMs = (h.interval || 30) * (h.unit === 'hours' ? 3600000 : 60000);
    var last = h.lastTriggered || 0;
    if(last === 0){
      h.lastTriggered = Date.now();
      changed = true;
      return;
    }
    if(Date.now() - last >= intervalMs){
      addDailyTask(today, h.name, 'habits', '');
      h.lastTriggered = Date.now();
      changed = true;
    }
  });
  if(changed) saveState();
}
